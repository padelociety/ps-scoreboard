<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Scoreboard – OBS Overlay</title>
<style>
  /* 서체 = IBM Plex Sans KR (OFL-1.1, fonts/OFL-IBMPlexSansKR.txt) — 앱·예약앱·토너먼트와 같은 하나(2026-10-01 "전부 통일").
     한글 11,172자 전부 + 라틴. 우리 repo 에서 직접 서빙(오프라인 TV 에서도 뜨게). */
  @font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/IBMPlexSansKR-Regular.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/IBMPlexSansKR-Medium.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/IBMPlexSansKR-SemiBold.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/IBMPlexSansKR-Bold.woff2') format('woff2')}
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; width:680px; font-family:'IBM Plex Sans KR',system-ui,sans-serif; }

  /* ══════ 플레이어스 럭셔리 '잉크 & 포일'(2026-10-04 — DESIGN_SYSTEM.md 1장 B안) ══════
     딥 잉크 판 · 크림 이름 · 포일 골드 점수 · 골드 헤어라인. 예전 초록·크림·노랑 배색을 걷어냈다.
     ⚠️ 크기(680 폭 · 제목 줄 + 62px 두 줄)는 그대로다 — OBS 에 잡아 둔 자리·크기를 다시 맞출 일이 없게. */
  :root {
    --ink0:   #123A42;
    --ink1:   #0E3038;
    --ink2:   #071B20;
    --cream:  #F2ECDC;
    --muted:  #8FA6A4;
    --foil:   #D9BC7A;
    --gold:   #C6A867;
    --hair:   rgba(198,168,103,.24);
    --hair-lo:rgba(198,168,103,.14);
    --terra:  #B3543C;
  }

  .scoreboard {
    width:680px;
    border-radius:14px;
    overflow:hidden;
    background:linear-gradient(180deg, var(--ink0) 0%, var(--ink1) 46%, var(--ink2) 100%);
    border:1px solid rgba(198,168,103,.38);
    box-shadow:0 10px 36px rgba(0,0,0,.55);
    font-family:'IBM Plex Sans KR',system-ui,sans-serif;
    font-variant-numeric: lining-nums tabular-nums;
    /* 데이터가 오기 전(그리고 경기 종료 후)에는 숨긴다. 안 그러면 방송에
       'Team A / Team B 0 0' 빈 점수판이 그대로 나간다. */
    opacity:0;
    transition:opacity .4s ease;
  }
  .scoreboard.on { opacity:1; }

  /* title bar — 잉크 위 크림 제목 + 골드 헤어라인 */
  .sb-title {
    color:var(--cream);
    padding:12px 20px 11px;
    font-size:28px;
    font-weight:600;
    letter-spacing:.3px;
    border-bottom:1px solid var(--hair);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* team rows */
  .sb-teams { }
  .sb-teams-inner { display:flex; align-items:stretch; }
  .sb-logo-panel {
    width:88px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; padding:10px 12px;
    border-right:1px solid var(--hair);
  }
  .sb-logo-panel img { width:100%; height:100%; object-fit:contain; }
  .sb-rows { flex:1; }

  /* one team row */
  .sb-row {
    display:grid;
    grid-template-columns: 1fr 64px 64px 64px 80px;
    align-items:stretch;
    height:62px;
    border-bottom:1px solid var(--hair-lo);
  }
  .sb-row:last-child { border-bottom:none; }
  .sb-name {
    padding:0 16px 0 18px;
    display:flex; align-items:center; gap:10px;
    font-size:28px; font-weight:700; color:var(--cream);
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .sb-name > span { overflow:hidden; text-overflow:ellipsis; }

  .serving .serve-dot { opacity:1; }
  .sb-row::before {
    content:''; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:0 2px 2px 0;
    background:var(--foil); opacity:0; transition:opacity .3s;
  }
  .sb-row.serving::before { opacity:1; }

  .sb-cell {
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--cream);
    border-left:1px solid var(--hair-lo);
    transition: background .25s, color .25s;
  }
  .sb-game  { font-size:36px; }
  /* 포인트 — 포일 골드, 칸을 살짝 밝혀 지금 점수가 어디인지 바로 보이게 */
  .sb-point { font-size:34px; color:var(--foil); background:rgba(198,168,103,.10); border-left:1px solid var(--hair); }
  /* 세트 — 끝난 세트는 뮤트, 지금 세트는 크림 */
  .sb-set   { font-size:26px; font-weight:600; color:transparent; }
  .sb-set.has-score { color:var(--muted); }
  .sb-set.sb-set-cur { color:var(--cream); font-size:30px; font-weight:700; }

  /* ══════ 26S3 중계 연출 ══════
     ⚠️ 이 오버레이는 **유튜브 시청자가 실제로 보는 화면**이고 영상 위에 얹힌다.
        tv.html(코트 TV)보다 더 절제한다 — 세트 획득 전체화면 연출·하단 띠는 넣지 않는다
        (영상을 가린다). 늘 도는 애니메이션도 늘리지 않는다. transform/opacity 만. */
  @keyframes pop {
    0%   { transform:scale(1); }
    40%  { transform:scale(1.35); }
    100% { transform:scale(1); }
  }
  .pop { animation: pop .25s ease-out; }

  /* 득점 — 위에서 떨어져 꽂힌다 / 정정 — 조용히 (둘이 같아 보이면 오타 정정이 득점처럼 보인다) */
  @keyframes ptIn   { 0%{transform:translateY(-40%) scale(.8);opacity:0} 55%{transform:translateY(0) scale(1.2);opacity:1} 100%{transform:translateY(0) scale(1);opacity:1} }
  @keyframes ptDown { 0%{transform:scale(1.1);opacity:.45} 100%{transform:scale(1);opacity:1} }
  .pt-in   { animation: ptIn .4s cubic-bezier(.2,.9,.25,1.1); }
  .pt-down { animation: ptDown .28s ease-out; }

  /* 게임 획득 — 진행 중 세트 칸이 한 번 부푼다 */
  @keyframes gameWin { 0%{transform:scale(1)} 30%{transform:scale(1.35)} 100%{transform:scale(1)} }
  .game-win { animation: gameWin .7s cubic-bezier(.2,.9,.25,1.1); }

  /* 득점한 팀 행을 한 번 쓸어준다(포일 빛) */
  .sb-row { position:relative; }
  .sb-row::after {
    content:''; position:absolute; inset:0; pointer-events:none; opacity:0;
    background: linear-gradient(90deg, transparent, rgba(217,188,122,.16), transparent);
  }
  .sb-row.scored::after { animation: rowSweep .55s ease-out; }
  @keyframes rowSweep { 0%{opacity:0;transform:translateX(-35%)} 35%{opacity:1} 100%{opacity:0;transform:translateX(35%)} }

  /* 세트/매치 포인트 배지 — 중계에서 가장 드라마가 큰 한 줄인데 26S2 엔 없었다.
     새 데이터가 필요 없다: 게임·포인트만 보면 계산된다.
     ⚠️ **타이틀바에 둔다.** 처음엔 팀 이름 옆에 붙였는데, 이 오버레이의 이름 칸은
        320px 뿐이라 배지가 잘리거나(overflow:hidden) 선수 이름을 잘라야 했다 —
        중계에서 선수 이름을 자르는 건 배지를 못 보여주는 것보다 나쁘다.
        어느 팀인지는 ▲(위 줄) ▼(아래 줄) 로 가리킨다.
     럭셔리: 세트포인트 = 포일 테두리 알약 · 매치포인트 = 테라코타 채움(한 단계 더 진하다). */
  .sb-title { display:flex; align-items:center; gap:14px; }
  .sb-title-text { flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb-title .crit {
    display:none; flex:none;
    font-size:17px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;
    padding:4px 14px; border-radius:999px; white-space:nowrap;
    background:rgba(198,168,103,.12); color:var(--foil); border:1px solid var(--foil);
  }
  .sb-title .crit.show  { display:inline-flex; animation: critIn .3s cubic-bezier(.2,.9,.25,1.1), critPulse 1.3s ease-in-out .3s infinite alternate; }
  .sb-title .crit.match { background:var(--terra); color:var(--cream); border-color:var(--terra); }
  @keyframes critIn    { 0%{opacity:0;transform:scale(.7)} 100%{opacity:1;transform:scale(1)} }
  @keyframes critPulse { 0%{opacity:.7} 100%{opacity:1} }

  @media (prefers-reduced-motion: reduce) {
    .pop, .pt-in, .pt-down, .game-win, .sb-row.scored::after, .sb-title .crit.show,
    .gold-banner-text, .star-banner-text, .gold-banner::after, .star-banner::after { animation:none; }
  }

  /* ── 결정 포인트 배너(골든 ◆ · 스타 ★) ──
     잉크 띠 + 골드 헤어라인 + 포일 캡스. 예전의 강한 발광은 걷어냈다 — 영상 위에서 번진다.
     골든은 포일을 **채운다**(한 포인트로 게임이 끝나는 순간이라 가장 진하다). 스타는 포일 글자만. */
  .gold-banner, .star-banner {
    display:none;
    padding: 9px 20px;
    text-align: center;
    border-top: 1px solid var(--foil);
    position: relative;
    overflow: hidden;
  }
  .gold-banner { background: linear-gradient(90deg, #B69352 0%, #D9BC7A 50%, #B69352 100%); }
  .star-banner { background: rgba(7,27,32,.96); }
  .gold-banner.visible, .star-banner.visible { display:block; }
  .gold-banner-text, .star-banner-text {
    font-family: 'IBM Plex Sans KR',system-ui,sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 7px;
    text-transform: uppercase;
    animation: decideBreath 1.2s ease-in-out infinite alternate;
  }
  .gold-banner-text { color: var(--ink2); }
  .star-banner-text { color: var(--foil); }
  .gold-banner-text .crown, .star-banner-text .star { font-size: 18px; margin: 0 10px; }
  @keyframes decideBreath { 0% { opacity:.78; } 100% { opacity:1; } }
  @keyframes shimmer {
    0%   { left: -100%; }
    100% { left: 200%; }
  }
  .gold-banner::after, .star-banner::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    animation: shimmer 2.2s linear infinite;
  }
  .gold-banner::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.30), transparent); }
  .star-banner::after { background: linear-gradient(90deg, transparent, rgba(217,188,122,0.16), transparent); }

  /* ── TIE BREAK 배너 ──
     ⚠️ 스타·골든과 달리 **빛나지 않는다** (tv.html 과 같은 결정). 저 둘은 한 포인트짜리
        순간이지만 타이브레이크는 몇 분씩 떠 있다 — 계속 명멸하면 화면이 피곤해지고
        정작 결정 포인트가 왔을 때 구분이 안 된다. 나타날 때 한 번만 알린다. */
  .tb-banner {
    display: none;
    background: rgba(7,27,32,.96);
    border-top: 1px solid var(--hair);
    padding: 8px 20px;
    text-align: center;
  }
  .tb-banner.visible { display: block; animation: tbIn .5s cubic-bezier(.2,.9,.25,1.1); }
  .tb-banner-text {
    font-family: 'IBM Plex Sans KR',system-ui,sans-serif;
    font-size: 20px; font-weight: 700; letter-spacing: 6px;
    color: var(--cream); text-transform: uppercase;
  }
  .tb-banner-text em { font-style: normal; letter-spacing: 2px; color: var(--foil); font-weight: 600; }
  @keyframes tbIn { 0% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 1; transform: none; } }
  /* 타이브레이크엔 40-40 이 없다 — 낡은 스타·골든 플래그가 함께 뜨지 않게 한다. */
  body.tb-on .star-banner, body.tb-on .gold-banner { display: none; }
</style>
</head>

<script type="module">
  // Firebase 는 아래에서 동적 import 한다. 상단 정적 import 로 두면 gstatic 이 막히거나

  // 점수판이 사라진다. 실패해도 페이지는 살아 있어야 한다.

  const firebaseConfig = {
    apiKey:            "AIzaSyBkrib1qzN8IE9NcW8tXTfKb4Z6JsOjcvE",
    authDomain:        "ps-score-868bb.firebaseapp.com",
    databaseURL:       "https://ps-score-868bb-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "ps-score-868bb",
    storageBucket:     "ps-score-868bb.firebasestorage.app",
    messagingSenderId: "48470302084",
    appId:             "1:48470302084:web:b037acc0b58f7e85d191d1"
  };

  const POINTS = ['0','15','30','40','AD'];

  let prevPointA = 0;
  let prevPointB = 0;
  let prevGameA = 0, prevGameB = 0, prevServe = '';
  /**
   * ⚠️ **첫 스냅샷은 연출 없이 그린다.** OBS 브라우저소스는 경기 도중에 새로고침되는
   * 일이 흔하다 — 그때 첫 스냅샷을 '변화'로 읽으면 아까 딴 포인트가 방금 난 것처럼
   * 떨어지고, 중계에 없는 일이 그대로 방송된다.
   */
  let firstPaint = true;

  function pop(el) {
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }
  /** 클래스를 뗐다 붙여 애니메이션을 다시 튼다 (연속 득점에도 매번 돌게). */
  function replay(el, cls) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  /**
   * 지금이 타이브레이크인가 — '' | 'tb'(7점) | 'stb'(슈퍼 타이브레이크 10점).
   *
   * ⚠️ **한 곳에만 적는다.** 예전엔 점수 표기(useRaw)와 critOf 가 각자 적고 있었고
   *    조건이 미묘하게 달랐다(슈퍼TB 를 빼느냐 마느냐). 거기에 배너까지 세 벌이 되면
   *    언젠가 갈라져서 '숫자는 타이브레이크인데 배너는 안 뜨는' 화면이 된다.
   */
  function gameTargetOf(S) {
    const n = S?.gameTarget | 0;
    return n >= 2 ? n : 6;
  }

  function tbKindOf(S) {
    const sets = (S.a?.sets || []).length;
    const gTarget = gameTargetOf(S);
    if (S.superTB && sets === 2) return 'stb';
    if ((S.a?.game | 0) === gTarget && (S.b?.game | 0) === gTarget) return 'tb';
    return '';
  }

  /**
   * 세트/매치 포인트 판정 — 새 데이터 없이 게임·포인트만으로 계산된다.
   * '이 포인트를 따면 게임을 가져가고, 그 게임으로 세트(또는 경기)가 끝나는가'.
   *
   * 타이브레이크는 7점·2점 차, 슈퍼타이브레이크는 10점·2점 차로 본다.
   * 세트 길이는 PS Control 설정(`gameTarget`, 4·6·8)이 정한다 — 여기에 6 을 박으면
   * 8게임 경기에서 **없는 세트포인트**가 방송된다.
   * ⚠️ 확정이 아니라 **표시**다 — 세트 종료는 사람이 [Save Set] 으로 정한다(동점 뒤
   *    타이브레이크를 할지, 몇 세트 경기인지가 대회마다 달라서 규칙을 박지 않는다).
   */
  function critOf(S, me, you) {
    const sets = (S.a?.sets || []).length;
    const kind = tbKindOf(S);
    const isTB = kind === 'tb';
    const isSTB = kind === 'stb';
    const p = me.point | 0, q = you.point | 0;

    // 타이브레이크: 다음 한 점으로 끝나는가
    if (isTB || isSTB) {
      const target = isSTB ? 10 : 7;
      if (p + 1 >= target && p + 1 - q >= 2) return sets >= 1 ? 'match point' : 'set point';
      return '';
    }
    // 일반 게임: 다음 한 점으로 게임을 가져가는가
    const decider = (S.deuce || 0) > (typeof S.deuceLimit === 'number' ? S.deuceLimit : 2) || !!S.starForce;
    const winsGame = (p === 3 && q <= 2) || (p === 4) || (p === 3 && q === 3 && decider);
    if (!winsGame) return '';
    // 그 게임으로 세트가 끝나는가 — 목표 게임 + 2게임 차, 또는 한 게임 더(6게임이면 7-5/7-6)
    const gTarget = gameTargetOf(S);
    const g = (me.game | 0) + 1, h = you.game | 0;
    const winsSet = (g >= gTarget && g - h >= 2) || g === gTarget + 1;
    if (!winsSet) return '';
    // 이번 세트로 경기가 끝나는가 — 이미 한 세트를 이겨 뒀다면 매치포인트
    const mySets = (me.sets || []).filter((v, i) => v > (you.sets || [])[i]).length;
    return mySets >= 1 ? 'match point' : 'set point';
  }
  /**
   * 타이틀바 배지 하나에 두 팀을 합쳐 그린다.
   * 결정 포인트(40-40 스타/골든)에서는 **양쪽 다** 세트포인트라 화살표를 빼고 문구만 둔다 —
   * 둘 다 가리키는 화살표는 아무것도 안 가리키는 것과 같다.
   */
  function paintCrit(critA, critB) {
    const el = document.getElementById('sbCrit');
    if (!el) return;
    const text = critA && critB ? critA
      : critA ? '▲ ' + critA
      : critB ? '▼ ' + critB : '';
    const on = !!text;
    if (on && el.textContent !== text) el.textContent = text;
    el.classList.toggle('match', /match/.test(text));
    if (on !== el.classList.contains('show')) el.classList.toggle('show', on);
  }

  function render(S) {
    document.getElementById('sbTitle').textContent  = S.title  || '';
    document.getElementById('sbNameA').textContent  = S.a.name || '';
    document.getElementById('sbNameB').textContent  = S.b.name || '';

    // 타이브레이크(6-6)·슈퍼TB(3세트)는 숫자 그대로, 아니면 15/30/40 매핑 (스타포인트 모드면 AD 대신 ⭐) — tv.html 과 동일 규칙
    const starMode = !!S.starPoint;
    const tbKind = tbKindOf(S);        // '' | 'tb' | 'stb' — 판정은 tbKindOf 한 곳
    const useRaw = !!tbKind;           // 타이브레이크는 0·15·30 이 아니라 숫자 그대로
    // 결정 포인트(2듀스 ★ · 골든 ◆)는 40-40 **양쪽**에 찍는다 — 콘솔 fmtPoint 와 같은 규칙.
    // 2듀스에선 AD(포인트 4)가 진짜 어드밴티지라, 예전처럼 AD 자리를 ⭐ 로 덮으면
    // 어드밴티지와 결정 포인트가 화면에서 구분되지 않는다.
    const deciding = starMode ? '★' : (S.goldenPoint ? '◆' : '');
    const ptOf = (t) => (useRaw ? (t.point ?? 0) : deciding || POINTS[t.point] || String(t.point ?? 0));
    const ptA = ptOf(S.a);
    const ptB = ptOf(S.b);
    const elPA = document.getElementById('sbPointA');
    const elPB = document.getElementById('sbPointB');

    const nowPA = S.a.point ?? 0, nowPB = S.b.point ?? 0;
    if (nowPA !== prevPointA) { if (!firstPaint) { replay(elPA, nowPA > prevPointA ? 'pt-in' : 'pt-down'); if (nowPA > prevPointA) replay(document.getElementById('rowA'), 'scored'); } prevPointA = nowPA; }
    if (nowPB !== prevPointB) { if (!firstPaint) { replay(elPB, nowPB > prevPointB ? 'pt-in' : 'pt-down'); if (nowPB > prevPointB) replay(document.getElementById('rowB'), 'scored'); } prevPointB = nowPB; }

    elPA.textContent = ptA;
    elPB.textContent = ptB;

    // 세트/매치 포인트 배지
    paintCrit(critOf(S, S.a || {}, S.b || {}), critOf(S, S.b || {}, S.a || {}));

    // 스타 배너 — 2듀스면 몇 번째 듀스에서 왔는지까지. 26S2 엔 'STAR POINT' 한 줄뿐이라
    // 보는 사람은 그게 왜 떴는지 알 수 없었다.
    const st = document.getElementById('starBannerText');
    if (st) {
      const n = S.deuce | 0;
      st.innerHTML = n > 1
        ? '<span class="star">✦</span>DEUCE ' + n + ' · STAR POINT<span class="star">✦</span>'
        : '<span class="star">✦</span>STAR POINT<span class="star">✦</span>';
    }
    document.getElementById('starBanner').classList.toggle('visible', starMode);
    // 골든포인트 배너
    document.getElementById('goldBanner').classList.toggle('visible', !!S.goldenPoint);

    // 타이브레이크 배너 — **몇 점 경기인지까지** 적는다. 점수가 숫자로 바뀌는 것만으로는
    // 7점인지 10점인지 알 수 없고, 슈퍼 타이브레이크는 세트 대신 치는 것이라 더 그렇다.
    const tbEl = document.getElementById('tbBanner');
    const tbTxt = document.getElementById('tbBannerText');
    if (tbTxt && tbKind) {
      tbTxt.innerHTML = tbKind === 'stb'
        ? 'SUPER TIE BREAK&nbsp;&nbsp;<em>10점 · 2점 차</em>'
        : 'TIE BREAK&nbsp;&nbsp;<em>7점 · 2점 차</em>';
    }
    if (tbEl) tbEl.classList.toggle('visible', !!tbKind);
    document.body.classList.toggle('tb-on', !!tbKind);

    const serve = S.a.serving ? 'A' : S.b.serving ? 'B' : '';
    if (!firstPaint && serve && serve !== prevServe && prevServe) replay(document.getElementById('row' + serve), 'scored');
    prevServe = serve;
    document.getElementById('rowA').classList.toggle('serving', !!S.a.serving);
    document.getElementById('rowB').classList.toggle('serving', !!S.b.serving);

    const curSet = (S.a.sets || []).length;
    // 게임 획득 — 진행 중 세트 칸이 한 번 부푼다
    const nowGA = S.a.game ?? 0, nowGB = S.b.game ?? 0;
    if (!firstPaint && nowGA > prevGameA) replay(document.getElementById('sbSetA' + (Math.min(curSet, 2) + 1)), 'game-win');
    if (!firstPaint && nowGB > prevGameB) replay(document.getElementById('sbSetB' + (Math.min(curSet, 2) + 1)), 'game-win');
    prevGameA = nowGA; prevGameB = nowGB;
    for (let i = 0; i < 3; i++) {
      const ca = document.getElementById(`sbSetA${i+1}`);
      const cb = document.getElementById(`sbSetB${i+1}`);
      if (i < curSet) {
        ca.textContent = S.a.sets[i];
        cb.textContent = S.b.sets[i];
        ca.classList.add('has-score');    cb.classList.add('has-score');
        ca.classList.remove('sb-set-cur'); cb.classList.remove('sb-set-cur');
      } else if (i === curSet) {
        ca.textContent = S.a.game ?? 0;
        cb.textContent = S.b.game ?? 0;
        ca.classList.add('has-score','sb-set-cur');
        cb.classList.add('has-score','sb-set-cur');
      } else {
        ca.textContent = ''; cb.textContent = '';
        ca.classList.remove('has-score','sb-set-cur');
        cb.classList.remove('has-score','sb-set-cur');
      }
    }

    firstPaint = false;   // 여기서부터가 진짜 '변화'다
  }

  const sbEl = document.getElementById('sb');
  function show(on) { sbEl.classList.toggle('on', !!on); }

  // ?demo=1 — 경기가 없을 때 OBS 에서 자리·크기를 잡기 위한 샘플.
  // ⚠️ 일부러 **세트포인트 상태**로 둔다. 배지가 붙었을 때가 이름 줄이 가장 넓어지는
  //    순간이라, 그때 안 잘리면 경기 중에도 안 잘린다 — 자리를 잡으면서 확인할 수 있다.
  if (new URLSearchParams(location.search).get('demo') === '1') {
    render({
      title: 'PSiL 26S3 · Match 3',
      deuceLimit: 2,
      a: { name: '현수정 / 도우석', point: 3, game: 5, sets: [6], serving: true  },
      b: { name: '이주경 / 김민수', point: 2, game: 3, sets: [4], serving: false },
    });
    show(true);
  } else {
    // ── Firebase 실시간 리스닝 ──────────────────────────────
    (async () => {
      let initializeApp, getDatabase, ref, onValue;
      try {
        [{ initializeApp }, { getDatabase, ref, onValue }] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"),
        ]);
      } catch (e) {
        return;   // CDN 도달 불가 — 페이지는 살려두고 조용히 포기
      }

      const db = getDatabase(initializeApp(firebaseConfig));

      onValue(ref(db, 'scoreboard'), snap => {
        const S = snap.val();
        if (!S) { show(false); return; }
        render(S);
        // 리그앱이 경기 종료·이탈 시 setScoreboardVisible(false) 로 내린다.
        // 이 처리가 없으면 끝난 경기 점수판이 화면에 계속 남는다.
        show(S.visible !== false);
      }, () => {
        // 읽기 실패(권한·네트워크). 마지막 화면을 그대로 둔다 — 방송 중 갑자기
        // 점수판이 사라지는 것이 잠깐 값이 낡는 것보다 나쁘다.
      });
    })();
  }
</script>
</body>
</html>
