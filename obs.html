<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Scoreboard – OBS Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; width:680px; }

  :root {
    --green-dark: #1a472a;
    --green-mid:  #2d6a44;
    --green-light:#3a8a58;
    --cream:      #f0ead2;
    --cream-dark: #ddd5b5;
    --gold:       #f5c518;
  }

  .scoreboard {
    width:680px;
    border-radius:5px;
    overflow:hidden;
    box-shadow:0 6px 32px rgba(0,0,0,.7);
    font-family:'Barlow Condensed','Noto Sans KR',sans-serif;
    /* 데이터가 오기 전(그리고 경기 종료 후)에는 숨긴다. 안 그러면 방송에
       'Team A / Team B 0 0' 빈 점수판이 그대로 나간다. */
    opacity:0;
    transition:opacity .4s ease;
  }
  .scoreboard.on { opacity:1; }

  /* title bar */
  .sb-title {
    background:var(--green-dark);
    color:#fff;
    padding:13px 18px;
    font-size:32px;
    font-weight:700;
    letter-spacing:.3px;
    border-bottom:2px solid var(--green-mid);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* team rows */
  .sb-teams { background:var(--cream); }
  .sb-teams-inner { display:flex; align-items:stretch; }

  .sb-logo-panel {
    width:88px; flex-shrink:0;
    background:var(--green-dark);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; padding:6px;
  }
  .sb-logo-panel img { width:100%; height:100%; object-fit:contain; }

  .sb-rows { flex:1; }

  /* one team row */
  .sb-row {
    display:grid;
    grid-template-columns: 1fr 64px 64px 64px 80px;
    align-items:stretch;
    height:62px;
    border-bottom:1px solid var(--cream-dark);
  }
  .sb-row:last-child { border-bottom:none; }

  .sb-name {
    padding:0 16px;
    display:flex; align-items:center; gap:10px;
    font-size:30px; font-weight:700; color:#1a1a1a;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }

  .serving .serve-dot { opacity:1; }

  .sb-cell {
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#fff;
    border-left:1px solid rgba(255,255,255,.12);
    transition: background .25s, color .25s;
  }
  .sb-game  { background:var(--green-dark); font-size:38px; }
  .sb-point { background:var(--green-dark); font-size:32px; }
  .sb-set   { background:var(--green-mid);  font-size:28px; color:rgba(255,255,255,.3); }
  .sb-set.has-score { color:#fff; background:#235438; }
  .sb-set.sb-set-cur { background:var(--green-dark); color:#fff; }

  /* score pop animation */
  @keyframes pop {
    0%   { transform:scale(1); }
    40%  { transform:scale(1.35); }
    100% { transform:scale(1); }
  }
  .pop { animation: pop .25s ease-out; }

  /* ── GOLDEN POINT BANNER ── */
  .gold-banner {
    display:none;
    background: linear-gradient(90deg, #1a1200 0%, #3a2800 40%, #3a2800 60%, #1a1200 100%);
    padding: 10px 20px;
    text-align: center;
    border-top: 2px solid var(--gold);
    position: relative;
    overflow: hidden;
  }
  .gold-banner.visible { display:block; }
  .gold-banner-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 8px;
    color: var(--gold);
    text-transform: uppercase;
    animation: goldGlow 1.2s ease-in-out infinite alternate;
  }
  .gold-banner-text .crown { font-size: 22px; margin: 0 8px; }
  @keyframes goldGlow {
    0%   { text-shadow: 0 0 8px rgba(245,197,24,0.4), 0 0 20px rgba(245,197,24,0.2); opacity:0.85; }
    100% { text-shadow: 0 0 20px rgba(245,197,24,1), 0 0 50px rgba(245,197,24,0.8), 0 0 80px rgba(245,150,0,0.4); opacity:1; }
  }
  .gold-banner::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(245,197,24,0.25), transparent);
    animation: shimmer 1.8s linear infinite;
  }
  .star-banner {
    display:none;
    background: linear-gradient(90deg, #0f0f0f 0%, #1e1e1e 40%, #1e1e1e 60%, #0f0f0f 100%);
    padding: 10px 20px;
    text-align: center;
    border-top: 2px solid #b0b8c1;
    position: relative;
    overflow: hidden;
  }
  .star-banner.visible { display:block; }
  .star-banner-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #d0d8e0;
    text-transform: uppercase;
    animation: starGlow 1.2s ease-in-out infinite alternate;
  }
  .star-banner-text .star { font-size: 22px; margin: 0 8px; }
  @keyframes starGlow {
    0%   { text-shadow: 0 0 8px rgba(180,200,220,0.4), 0 0 20px rgba(180,200,220,0.2); opacity:0.8; color:#b0b8c8; }
    100% { text-shadow: 0 0 16px rgba(220,235,255,1), 0 0 40px rgba(200,220,255,0.8), 0 0 60px rgba(180,200,240,0.4); opacity:1; color:#e8f0ff; }
  }
  @keyframes shimmer {
    0%   { left: -100%; }
    100% { left: 200%; }
  }
  .star-banner::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(200,220,255,0.15), transparent);
    animation: shimmer 2.5s linear infinite;
  }
</style>

<!-- Firebase SDK -->
<script type="module">
  // Firebase 는 아래에서 동적 import 한다. 상단 정적 import 로 두면 gstatic 이 막히거나
  // 느릴 때 모듈 로드 자체가 실패해 스크립트가 통째로 안 돌고, 방송 중 CDN 장애면
  // 점수판이 사라진다. 실패해도 페이지는 살아 있어야 한다.

  const firebaseConfig = {
    apiKey:            "AIzaSyBkrib1qzN8IE9NcW8tXTfKb4Z6JsOjcvE",
    authDomain:        "ps-score-868bb.firebaseapp.com",
    databaseURL:       "https://ps-score-868bb-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "ps-score-868bb",
    storageBucket:     "ps-score-868bb.firebasestorage.app",
    messagingSenderId: "48470302084",
    appId:             "1:48470302084:web:b037acc0b58f7e85d191d1"
  };

  const POINTS = ['0','15','30','40','AD'];

  let prevPointA = 0;
  let prevPointB = 0;

  function pop(el) {
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }

  function render(S) {
    document.getElementById('sbTitle').textContent  = S.title  || '';
    document.getElementById('sbNameA').textContent  = S.a.name || '';
    document.getElementById('sbNameB').textContent  = S.b.name || '';

    // 타이브레이크(6-6)·슈퍼TB(3세트)는 숫자 그대로, 아니면 15/30/40 매핑 (스타포인트 모드면 AD 대신 ⭐) — tv.html 과 동일 규칙
    const starMode = !!S.starPoint;
    const sets = (S.a.sets || []).length;
    const isTB = S.a.game === 6 && S.b.game === 6;
    const isSuperTB = !!S.superTB && sets === 2;
    const useRaw = isTB || isSuperTB;
    const DISP = useRaw ? null : (starMode ? ['0','15','30','40','⭐'] : POINTS);
    const ptA = useRaw ? (S.a.point ?? 0) : (DISP[S.a.point] ?? S.a.point ?? '0');
    const ptB = useRaw ? (S.b.point ?? 0) : (DISP[S.b.point] ?? S.b.point ?? '0');
    const elPA = document.getElementById('sbPointA');
    const elPB = document.getElementById('sbPointB');

    if (S.a.point !== prevPointA) { pop(elPA); prevPointA = S.a.point; }
    if (S.b.point !== prevPointB) { pop(elPB); prevPointB = S.b.point; }

    elPA.textContent = ptA;
    elPB.textContent = ptB;

    // 스타 배너
    document.getElementById('starBanner').classList.toggle('visible', starMode);
    // 골든포인트 배너
    document.getElementById('goldBanner').classList.toggle('visible', !!S.goldenPoint);

    document.getElementById('rowA').classList.toggle('serving', !!S.a.serving);
    document.getElementById('rowB').classList.toggle('serving', !!S.b.serving);

    const curSet = (S.a.sets || []).length;
    for (let i = 0; i < 3; i++) {
      const ca = document.getElementById(`sbSetA${i+1}`);
      const cb = document.getElementById(`sbSetB${i+1}`);
      if (i < curSet) {
        ca.textContent = S.a.sets[i];
        cb.textContent = S.b.sets[i];
        ca.classList.add('has-score');    cb.classList.add('has-score');
        ca.classList.remove('sb-set-cur'); cb.classList.remove('sb-set-cur');
      } else if (i === curSet) {
        ca.textContent = S.a.game ?? 0;
        cb.textContent = S.b.game ?? 0;
        ca.classList.add('has-score','sb-set-cur');
        cb.classList.add('has-score','sb-set-cur');
      } else {
        ca.textContent = ''; cb.textContent = '';
        ca.classList.remove('has-score','sb-set-cur');
        cb.classList.remove('has-score','sb-set-cur');
      }
    }
  }

  const sbEl = document.getElementById('sb');
  function show(on) { sbEl.classList.toggle('on', !!on); }

  // ?demo=1 — 경기가 없을 때 OBS 에서 자리·크기를 잡기 위한 샘플.
  if (new URLSearchParams(location.search).get('demo') === '1') {
    render({
      title: 'PSiL 26S2 · Match 3',
      a: { name: '현수정 / 도우석', point: 2, game: 3, sets: [6, 4], serving: true  },
      b: { name: '이주경 / 김민수', point: 1, game: 2, sets: [3, 6], serving: false },
    });
    show(true);
  } else {
    // ── Firebase 실시간 리스닝 ──────────────────────────────
    (async () => {
      let initializeApp, getDatabase, ref, onValue;
      try {
        [{ initializeApp }, { getDatabase, ref, onValue }] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"),
        ]);
      } catch (e) {
        return;   // CDN 도달 불가 — 페이지는 살려두고 조용히 포기
      }

      const db = getDatabase(initializeApp(firebaseConfig));

      onValue(ref(db, 'scoreboard'), snap => {
        const S = snap.val();
        if (!S) { show(false); return; }
        render(S);
        // 리그앱이 경기 종료·이탈 시 setScoreboardVisible(false) 로 내린다.
        // 이 처리가 없으면 끝난 경기 점수판이 화면에 계속 남는다.
        show(S.visible !== false);
      }, () => {
        // 읽기 실패(권한·네트워크). 마지막 화면을 그대로 둔다 — 방송 중 갑자기
        // 점수판이 사라지는 것이 잠깐 값이 낡는 것보다 나쁘다.
      });
    })();
  }
</script>
