<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Live Ads – OBS Overlay</title>
<style>
  /* 라이브 코너 광고(2026-11-12) — OBS 브라우저 소스(480 x 270 · 16:9)로 방송 화면 오른쪽 위에 얹는다.
     ⚠️ 유튜브 시청자가 보는 화면이고 영상 위에 얹힌다 — obs.html 과 같은 절제: 잠깐 떴다가 빠진다(늘 떠 있지 않다),
        transform/opacity 만, 소리 없음. 배색·서체는 점수판(obs.html)과 한 벌('잉크 & 포일' · IBM Plex Sans KR).
     ⚠️ 칸이 16:9 인 이유: 같은 자리에 동영상 광고(ADS 의 video)를 그대로 넣는다.
     문구는 아래 ADS 한 곳. 사실(개점 시기·코트 수)은 공개 사이트 centers.json 과 같은 말로 적는다. */
  @font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/IBMPlexSansKR-Medium.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/IBMPlexSansKR-SemiBold.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/IBMPlexSansKR-Bold.woff2') format('woff2')}
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; width:480px; height:270px; overflow:hidden; }
  body { font-family:'IBM Plex Sans KR',system-ui,sans-serif; font-variant-numeric: lining-nums tabular-nums; }

  :root {
    --ink0:#123A42; --ink1:#0E3038; --ink2:#071B20;
    --cream:#F2ECDC; --muted:#8FA6A4; --foil:#D9BC7A; --gold:#C6A867;
    --hair:rgba(198,168,103,.24);
  }

  .slot { position:absolute; left:8px; top:8px; width:464px; height:254px; }   /* 그림자 자리 8px */
  .ad {
    position:absolute; inset:0; overflow:hidden;
    border-radius:14px;
    background:linear-gradient(180deg, var(--ink0) 0%, var(--ink1) 46%, var(--ink2) 100%);
    border:1px solid rgba(198,168,103,.38);
    box-shadow:0 6px 8px rgba(0,0,0,.45);
    opacity:0; transform:translateX(18px);
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.9,.25,1);
  }
  .ad.on { opacity:1; transform:none; }

  /* 센터 카드 */
  .card { position:absolute; inset:0; padding:20px 24px 0; display:flex; flex-direction:column; }
  .card .label { font-size:21px; font-weight:600; color:var(--foil); letter-spacing:.5px; white-space:nowrap; }
  .card .title { margin-top:-2px; font-size:78px; line-height:1.12; font-weight:700; color:var(--cream); letter-spacing:1px; white-space:nowrap; }
  .card .when  { margin-top:2px; font-size:30px; line-height:1.25; font-weight:700; color:var(--foil); white-space:nowrap; }
  .card .foot  {
    margin-top:auto; height:52px; display:flex; align-items:center; justify-content:space-between;
    border-top:1px solid var(--hair);
  }
  .card .note  { font-size:22px; font-weight:500; color:var(--cream); white-space:nowrap; }
  .card .mark  { height:26px; width:auto; opacity:.95; }
  .card .wolf  { position:absolute; right:22px; top:26px; width:150px; height:auto; opacity:.92; }

  /* 동영상 광고(같은 16:9 칸) */
  .ad video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  /* 들어온 뒤 포일 빛이 한 번 지나간다 */
  .ad::after {
    content:''; position:absolute; inset:0; pointer-events:none; opacity:0;
    background:linear-gradient(100deg, transparent 30%, rgba(217,188,122,.16) 50%, transparent 70%);
  }
  .ad.on::after { animation: adSweep 1.1s ease-out .45s 1; }
  @keyframes adSweep { 0%{opacity:0;transform:translateX(-60%)} 30%{opacity:1} 100%{opacity:0;transform:translateX(60%)} }

  @media (prefers-reduced-motion: reduce) {
    .ad { transition:opacity .2s linear; transform:none; }
    .ad.on::after { animation:none; }
  }
</style>
</head>
<body>
<div class="slot" id="slot"></div>

<script>
/* ══════ 광고 목록 — 문구는 여기 한 곳 ══════
   센터 카드: { id, label, title, when, note }      동영상: { id, video, seconds? }(소리 없이 튼다) */
const ADS = [
  { id: 'gimpo2',  label: '빠델소사이어티 2호점', title: '김포', when: '2026년 12월 오픈 예정', note: '실내 코트 2면' },
  { id: 'daejeon', label: '빠델소사이어티 3호점', title: '대전', when: '2027년 1월 오픈 예정',  note: '실내 코트 1면' },
];

/* ══════ 시간표(순수 함수 — ads.test.cjs 가 떼어 와 돌린다) ══════
   first 초 뒤 첫 광고 → show 초 보이고 → gap 초 쉬고 → 다음 광고 …  (광고 하나가 도는 주기 = (show + gap) x 광고 수)
   t = 페이지를 연 뒤 흐른 초. 돌려주는 값 { index: 지금 보일 광고(-1 = 없음), wait: 다음에 바뀔 때까지 초 } */
function adAt(t, n, o) {
  const show = o.show, gap = o.gap, first = o.first;
  if (!(n > 0) || !(show > 0)) return { index: -1, wait: 3600 };
  if (t < first) return { index: -1, wait: first - t };
  const cycle = show + gap;
  const u = t - first;
  const k = Math.floor(u / cycle);
  const into = u - k * cycle;
  if (into < show) return { index: k % n, wait: show - into };
  return { index: -1, wait: cycle - into };
}

/* 주소 옵션: ?show=20&gap=100&first=30 (초) · ?only=gimpo2,daejeon(고른 것만 · 적은 순서) · ?demo=1(쉬는 시간 없이 계속 — OBS 자리 잡기)
   숫자가 아니거나 범위를 벗어나면 기본값. */
function adOptions(search) {
  const q = new URLSearchParams(search || '');
  const num = (key, def, min, max) => {
    const raw = q.get(key);
    if (raw === null || raw.trim() === '') return def;
    const v = Number(raw);
    return Number.isFinite(v) && v >= min && v <= max ? v : def;
  };
  const demo = q.get('demo') === '1';
  const only = (q.get('only') || '').split(',').map(s => s.trim()).filter(Boolean);
  return {
    show:  num('show', 20, 5, 600),
    gap:   demo ? 0 : num('gap', 100, 0, 3600),
    first: demo ? 0 : num('first', 30, 0, 3600),
    only, demo,
  };
}

function pickAds(all, only) {
  if (!only || !only.length) return all.slice();
  const picked = only.map(id => all.find(a => a.id === id)).filter(Boolean);
  return picked.length ? picked : all.slice();
}

/* ══════ 그리기 ══════ */
(function () {
  const opt = adOptions(location.search);
  const ads = pickAds(ADS, opt.only);
  const slot = document.getElementById('slot');

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;      // 문구는 글자로만 넣는다(innerHTML 안 씀)
    return e;
  }
  function build(ad) {
    const box = el('div', 'ad');
    box.dataset.id = ad.id;
    if (ad.video) {
      const v = el('video');
      v.src = ad.video; v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
      box.appendChild(v);
      return box;
    }
    const card = el('div', 'card');
    const wolf = el('img', 'wolf'); wolf.src = 'brand/wolf-cream.png'; wolf.alt = '';
    card.appendChild(wolf);
    card.appendChild(el('div', 'label', ad.label));
    card.appendChild(el('div', 'title', ad.title));
    card.appendChild(el('div', 'when', ad.when));
    const foot = el('div', 'foot');
    foot.appendChild(el('div', 'note', ad.note));
    const mark = el('img', 'mark'); mark.src = 'brand/wordmark-cream.png'; mark.alt = 'Padel Society';
    foot.appendChild(mark);
    card.appendChild(foot);
    box.appendChild(card);
    return box;
  }

  const boxes = ads.map(build);
  boxes.forEach(b => slot.appendChild(b));

  let shown = -1;
  function show(i) {
    if (i === shown) return;
    boxes.forEach((b, k) => {
      const on = k === i;
      b.classList.toggle('on', on);
      const v = b.querySelector('video');
      if (v) { if (on) { try { v.currentTime = 0; } catch (e) {} v.play().catch(() => {}); } else v.pause(); }
    });
    shown = i;
  }

  const t0 = performance.now();
  function tick() {
    const t = (performance.now() - t0) / 1000;
    const a = adAt(t, boxes.length, opt);
    show(a.index);
    setTimeout(tick, Math.max(250, Math.min(a.wait, 30) * 1000));   // 길게 자지 않는다(탭이 멈췄다 돌아와도 30초 안에 맞춘다)
  }
  tick();
})();
</script>
</body>
</html>
