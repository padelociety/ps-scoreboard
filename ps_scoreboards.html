(function () {
  var BUILD = "c5";
  function check() {
    fetch(location.href.split('?')[0] + '?n=' + Date.now(), { cache: 'no-store' })

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyBkrib1qzN8IE9NcW8tXTfKb4Z6JsOjcvE",
    authDomain: "ps-score-868bb.firebaseapp.com",
    databaseURL: "https://ps-score-868bb-default-rtdb.asia-southeast1.firebasedatabase.app",

    messagingSenderId: "48470302084",
    appId: "1:48470302084:web:b037acc0b58f7e85d191d1"
  };
  firebase.initializeApp(firebaseConfig);
  var ref = firebase.database().ref('scoreboard');
  var POINTS = ['0', '15', '30', '40', 'AD'];
  function txt(id, v) { document.getElementById(id).textContent = v; }
  function setCell(id, val, cls) { var el = document.getElementById(id); el.textContent = val; el.className = 'cell ' + cls; }
  ref.on('value', function (snap) {
    var S = snap.val(); if (!S) return;
    var a = S.a || {}, b = S.b || {};
    txt('sbTitle', S.title || '');
    txt('nameA', a.name || 'Team A');
    txt('nameB', b.name || 'Team B');
    document.getElementById('rowA').classList.toggle('serving', !!a.serving);
    document.getElementById('rowB').classList.toggle('serving', !!b.serving);
    var setsA = a.sets || [], setsB = b.sets || [], curSet = setsA.length;
    for (var i = 0; i < 3; i++) {
      if (i < curSet) { setCell('a' + i, setsA[i], ''); setCell('b' + i, setsB[i], ''); }
      else if (i === curSet) { setCell('a' + i, (a.game != null ? a.game : 0), 'current'); setCell('b' + i, (b.game != null ? b.game : 0), 'current'); }
      else { setCell('a' + i, '', 'empty'); setCell('b' + i, '', 'empty'); }
    }
    var starMode = !!S.starPoint;
    var isTB = (a.game === 6 && b.game === 6);
    var isSuperTB = !!S.superTB && curSet === 2;
    var useRaw = isTB || isSuperTB;
    var DISP = useRaw ? null : (starMode ? ['0','15','30','40','⭐'] : POINTS);
    function pt(x){ return useRaw ? (x!=null?x:0) : (DISP[x]!=null?DISP[x]:(x!=null?x:'0')); }
    var eA=document.getElementById('pA'); eA.textContent=pt(a.point); eA.className='cell pt';
    var eB=document.getElementById('pB'); eB.textContent=pt(b.point); eB.className='cell pt';
    document.getElementById('goldBanner').classList.toggle('show', !!S.goldenPoint);
    document.getElementById('starBanner').classList.toggle('show', !!S.starPoint);

  });
</script>
