<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ⚠️ TV 브라우저·키오스크가 옛 파일을 붙잡지 않도록 캐시 무효화 (서비스워커 없음) -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PS Scoreboard – TV</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 한글 디스플레이 = 마루부리 (OFL-1.1, fonts/OFL-MaruBuri.txt).
     라틴·숫자는 Playfair Display 가 먼저 잡고, 한글만 여기로 폴백된다. */
  @font-face { font-family:'MaruBuri'; font-style:normal; font-weight:400; font-display:swap;
               src:url('fonts/MaruBuri-Regular.woff2') format('woff2'); }
  @font-face { font-family:'MaruBuri'; font-style:normal; font-weight:700; font-display:swap;
               src:url('fonts/MaruBuri-Bold.woff2') format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 럭셔리 잉크 — DESIGN_SYSTEM.md §1 다크(잉크). 전광판이라 페이퍼 대신 잉크 배경.
     --green/--green2/--dark 이름은 기존 규칙들이 계속 참조해서 그대로 두고 값만 잉크로 바꾼다. */
  /* ══════════ 테마 토큰 ══════════
   * 기본 = 럭셔리 잉크 (DESIGN_SYSTEM.md §1 다크). body.theme-classic 이 값만 갈아끼운다.
   * 알파를 섞어 쓰는 색은 --*-rgb 로도 둬서 rgba(var(--gold-rgb), .22) 로 쓴다.
   * --green/--dark 이름은 예전 규칙들이 참조해서 그대로 두고 값만 테마별로 바꾼다. */
  :root {
    --ink0:     #123A42;   /* 그라데이션 최상단 */
    --green:    #0E3038;   /* 바탕 시작 */
    --green2:   #123A42;
    --dark:     #071B20;   /* 바탕 끝 · 골드 위 글자색 */
    --tv-bg:    radial-gradient(120% 100% at 50% 0%, var(--ink0) 0%, var(--green) 42%, var(--dark) 100%);

    --cream:    #F2ECDC;   --cream-rgb: 242,236,220;
    --gold:     #C6A867;   --gold-rgb:  198,168,103;   /* 라벨·헤어라인 */
    --gold-hi:  #D9BC7A;                               /* 점수·승자 */
    --gold-dim: #A88948;                               /* 골드 그라데이션 끝 */
    --terra:    #B3543C;   --live-rgb:  179,84,60;     /* LIVE·패배 (§3-9) */
    --muted:    #8AA0A0;
    --silver:   #d0d8e0;
    --conn:     #4caf50;

    --disp: 'Playfair Display','MaruBuri',Georgia,'Times New Roman',serif;
    --ui:   'Inter','Noto Sans KR',system-ui,sans-serif;
    --num:  lining-nums tabular-nums;
  }

  /* ── 클래식: 리디자인 전 전광판 그대로 (딥그린 + 골드 + Barlow Condensed).
   *    형태(레이아웃·헤어라인·번호 거터)는 공유하고 팔레트와 서체만 바꾼다.
   *    서브권은 두 테마 다 골드 점 — 예전 라켓 PNG 는 b10 에서 걷어냈다. ── */
  /* ── 클래식: 회원 앱 '클래식' 스킨(다크)의 색 그대로.
   *    background #0F1B2D · cardBg #1B2A41 · primary #4CBEAA · accent #34B39F · red #E53E3E
   *    형태(2단 레이아웃·헤어라인·번호 거터·홈/원정 스택)는 럭셔리와 공유하고 색·서체만 바뀐다.
   *    서체는 예전 전광판 그대로 Barlow Condensed(+한글 Noto Sans KR).
   *    앱과 똑같이 AstaSans 를 쓰려면 폰트 파일을 이 공개 repo 에 같이 올려야 한다 — 라이선스 확인 후. ── */
  body.theme-classic {
    --ink0:     #1B2A41;   /* cardBg */
    --green:    #0F1B2D;   /* background */
    --green2:   #1B2A41;
    --dark:     #0A1220;
    --tv-bg:    var(--green);   /* 클래식 앱은 평면 배경 */

    --cream:    #E8F0F7;   --cream-rgb: 232,240,247;   /* 다크 위 본문 */
    --gold:     #34B39F;   --gold-rgb:  52,179,159;    /* accent — 라벨·헤어라인 */
    --gold-hi:  #4CBEAA;                               /* primary — 점수·승자 */
    --gold-dim: #2E9E8F;
    --terra:    #E53E3E;   --live-rgb:  229,62,62;     /* red — LIVE·패배 */
    --muted:    #7A95A5;                               /* secondary */
    --conn:     #4CBEAA;

    --disp: 'Barlow Condensed','Noto Sans KR',sans-serif;
    --ui:   'Barlow Condensed','Noto Sans KR',sans-serif;
    --num:  normal;
  }


  html, body {
    width:100%; height:100%;
    background: var(--tv-bg);
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--disp);
    /* Playfair 기본은 올드스타일 숫자 — 점수·순위가 베이스라인 아래로 떨어진다 (§2) */
    font-variant-numeric: var(--num);
    min-height: 100vh;
  }

  /* ── 배경 패턴 ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.03) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(255,255,255,0.03) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ── 메인 컨테이너 ── */
  .sb-wrap {
    position: relative;
    width: min(96vw, 1400px);
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ── 배너: 카드 아래에 absolute 고정 (카드 안 밀림) ── */
  .star-banner,
  .gold-banner {
    position: absolute;
    left: 0; right: 0;
    top: calc(100% + 12px);
  }

  /* ── 타이틀 바 ── */
  .sb-title {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(var(--gold-rgb),0.3);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 24px;
  }
  .sb-title-text {
    font-size: clamp(28px, 4vw, 52px);
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--cream);
    text-transform: uppercase;
  }

  /* ── 팀 행 ── */
  .sb-teams {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.08);
    border-top: none;
  }

  .sb-row {
    display: grid;
    grid-template-columns: 1fr 120px 120px 120px 160px;
    align-items: center;
    padding: 0 40px;
    min-height: 130px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    transition: background 0.3s;
  }
  .sb-row:last-child { border-bottom: none; }
  .sb-row.serving {
  }

  /* 이름 */
  .sb-name {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .sb-name span {
    font-size: clamp(36px, 5vw, 72px);
    font-weight: 800;
    color: var(--cream);
    letter-spacing: 1px;
    line-height: 1;
  }
  /* 서브권 — 골드 점. 예전엔 라켓 PNG(base64 28KB)에 filter 로 색을 입혔는데,
     잉크 팔레트에선 그 필터가 흰 얼룩으로 뭉개진다. view-all 과 같은 조형으로 통일. */
  .serve-icon {
    width: clamp(20px, 2vw, 30px);
    height: clamp(20px, 2vw, 30px);
    border-radius: 50%;
    background: var(--gold-hi);
    box-shadow: 0 0 clamp(12px, 1.4vw, 22px) rgba(var(--gold-rgb),0.85);
    opacity: 0;
    transition: opacity 0.3s;
    flex-shrink: 0;
  }
  .serving .serve-icon { opacity: 1; }

  /* 셀 헤더 */
  .sb-header {
    display: grid;
    grid-template-columns: 1fr 120px 120px 120px 160px;
    padding: 12px 40px 8px;
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.08);
    border-top: none;
    border-bottom: none;
  }
  .sb-header-cell {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 3px;
    color: rgba(var(--cream-rgb),0.4);
    text-align: center;
    text-transform: uppercase;
  }
  .sb-header-cell:first-child { text-align: left; }

  /* 셀 */
  .sb-cell {
    text-align: center;
    font-size: clamp(40px, 5.5vw, 80px);
    font-weight: 900;
    color: var(--cream);
    line-height: 1;
  }
  .sb-cell.set {
    font-size: clamp(48px, 6vw, 92px);
    color: rgba(var(--cream-rgb),0.5);
  }
  .sb-cell.set.has-score {
    color: rgba(var(--cream-rgb),0.85);
  }
  .sb-cell.set.current {
    color: var(--cream);
    font-size: clamp(56px, 7vw, 108px);
  }
  .sb-cell.point {
    color: var(--gold);
    font-size: clamp(48px, 6vw, 96px);
  }

  /* 구분선 */
  .sb-divider {
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(var(--gold-rgb),0.4), transparent);
    border: none;
  }

  /* ── STAR POINT 배너 ── */
  .star-banner {
    display: none;
    background: linear-gradient(90deg, #0a0a0a 0%, #1e1e1e 40%, #1e1e1e 60%, #0a0a0a 100%);
    border: 1px solid rgba(208,216,224,0.3);
    border-radius: 0 0 12px 12px;
    padding: 14px 40px;
    text-align: center;
    overflow: hidden;
  }
  .star-banner.visible { display: block; }
  .star-banner-text {
    font-size: clamp(24px, 3vw, 44px);
    font-weight: 900;
    letter-spacing: 10px;
    color: var(--silver);
    animation: starGlow 1.2s ease-in-out infinite alternate;
  }
  @keyframes starGlow {
    0%   { text-shadow: 0 0 8px rgba(180,200,220,0.4); opacity:0.8; color: #b0b8c8; }
    100% { text-shadow: 0 0 20px rgba(220,235,255,1), 0 0 50px rgba(200,220,255,0.6); opacity:1; color: #e8f0ff; }
  }
  .star-banner::after {
    content:'';
    position:absolute;
    top:0; left:-100%;
    width:60%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(200,220,255,0.12), transparent);
    animation: shimmer 2.5s linear infinite;
  }

  /* ── GOLDEN POINT 배너 ── */
  .gold-banner {
    display: none;
    background: linear-gradient(90deg, #0a0800 0%, #2a1f00 40%, #2a1f00 60%, #0a0800 100%);
    border: 1px solid rgba(var(--gold-rgb),0.35);
    border-radius: 0 0 12px 12px;
    padding: 14px 40px;
    text-align: center;
    overflow: hidden;
  }
  .gold-banner.visible { display: block; }
  .gold-banner-text {
    font-size: clamp(24px, 3vw, 44px);
    font-weight: 900;
    letter-spacing: 10px;
    color: var(--gold);
    animation: goldGlow 1.2s ease-in-out infinite alternate;
  }
  @keyframes goldGlow {
    0%   { text-shadow: 0 0 8px rgba(var(--gold-rgb),0.4); opacity:0.85; }
    100% { text-shadow: 0 0 24px rgba(var(--gold-rgb),1), 0 0 60px rgba(245,150,0,0.5); opacity:1; }
  }
  .gold-banner::after {
    content:'';
    position:absolute;
    top:0; left:-100%;
    width:60%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(var(--gold-rgb),0.18), transparent);
    animation: shimmer 1.8s linear infinite;
  }

  @keyframes shimmer {
    0%   { left:-100%; }
    100% { left:200%; }
  }

  /* ── 점수 팝 애니메이션 ── */
  @keyframes pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop .3s ease-out; }

  /* ── 연결 상태 ── */
  .conn-dot {
    position: fixed;
    bottom: 20px;
    right: 24px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #555;
    transition: background 0.4s;
  }
  .conn-dot.on { background: var(--conn); box-shadow: 0 0 6px var(--conn); }

  /* ══════════════ 대진표 패널 (토글: B키 / 패널 클릭 / ?bracket=0) ══════════════ */
  /* 대진표 표시 중엔 점수판을 컴팩트하게 눌러 함께 보이게 한다 */
  body.bracket-on { justify-content: flex-start; padding-top: 2.5vh; }
  body.bracket-on .sb-title { padding: 10px 40px; }
  body.bracket-on .sb-title-text { font-size: clamp(20px, 2.4vw, 34px); }
  body.bracket-on .sb-row { min-height: 128px; }
  body.bracket-on .sb-name span { font-size: clamp(34px, 4.4vw, 62px); }
  body.bracket-on .sb-cell { font-size: clamp(52px, 6.6vw, 100px); }
  body.bracket-on .sb-cell.set { font-size: clamp(44px, 5.4vw, 80px); }
  body.bracket-on .sb-cell.set.current { font-size: clamp(52px, 6.6vw, 100px); }
  body.bracket-on .sb-cell.point { font-size: clamp(46px, 5.6vw, 92px); }
  body.bracket-on .sb-header { padding: 8px 40px 6px; }
  body.bracket-on .sb-header-cell { font-size: 14px; }


  .bracket-panel {
    display: none;
    width: min(96vw, 1520px);
    margin-top: 64px; /* star/gold 배너(absolute)와 겹치지 않게 */
  }
  body.bracket-on .bracket-panel { display: block; }

  .bk-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 0 6px 14px 6px;
    flex-wrap: wrap;
  }
  .bk-title {
    font-size: clamp(18px, 2vw, 28px);
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .bk-sub {
    font-size: clamp(12px, 1.2vw, 16px);
    color: rgba(var(--cream-rgb),0.5);
    letter-spacing: 2px;
  }
  /* ── 대진표: 라운드 가로 배치 + 엘보 연결선 오버레이 ── */
  .bk-cols {
    position: relative;
    display: flex;
    gap: 26px;
    align-items: stretch;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  svg.bk-conns { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 0; overflow: visible; }
  .bk-col {
    position: relative;
    z-index: 1;
    flex: 1 1 0;
    min-width: 212px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bk-round-label {
    font-size: clamp(11px, 1vw, 14px);
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--gold);
    text-align: center;
    text-transform: uppercase;
    opacity: 0.85;
    padding-bottom: 6px;
  }
  .bk-round-label small {
    display: block;
    font-size: clamp(9px, 0.72vw, 11px);
    letter-spacing: 3px;
    color: rgba(var(--cream-rgb),0.4);
    font-weight: 600;
    margin-top: 3px;
  }
  .bk-col-inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 14px;
  }
  .bk-match {
    position: relative;
    z-index: 1;
    background: linear-gradient(180deg, rgba(18,58,66,0.55), rgba(7,27,32,0.72));
    border: 1px solid rgba(var(--gold-rgb),0.18);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  /* 3·4위전 — 결승 칼럼 하단에 표준 배치 */
  .bk-third { margin-top: 26px; }
  .bk-third .bk-round-label { padding-bottom: 8px; opacity: 0.7; }
  .bk-match.done { border-color: rgba(var(--gold-rgb),0.34); }
  .bk-match.live {
    border-color: rgba(var(--live-rgb),0.85);
    animation: liveGlow 1.4s ease-in-out infinite alternate;
  }
  @keyframes liveGlow {
    0%   { box-shadow: 0 0 0 1px rgba(var(--live-rgb),0.4), 0 0 8px rgba(var(--live-rgb),0.3); }
    100% { box-shadow: 0 0 0 1px rgba(var(--live-rgb),0.7), 0 0 24px rgba(var(--live-rgb),0.7); }
  }
  .bk-livebadge {
    position: absolute;
    top: -10px; left: 10px; z-index: 3;
    background: var(--terra); color: #fff;
    font-size: clamp(9px, 0.72vw, 12px); font-weight: 800; letter-spacing: 2px;
    padding: 2px 7px; border-radius: 4px;
    display: flex; align-items: center; gap: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .bk-livebadge i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: bkBlink 0.9s steps(2) infinite; }
  @keyframes bkBlink { 50% { opacity: 0.2; } }
  .bk-time {
    font-size: clamp(10px, 0.9vw, 13px);
    color: rgba(var(--cream-rgb),0.4);
    letter-spacing: 1px;
    padding: 5px 12px 0;
  }
  .bk-team {
    position: relative;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 13px;
    font-size: clamp(14px, 1.4vw, 20px);
    font-weight: 700;
    color: var(--cream);
    line-height: 1.15;
  }
  .bk-team + .bk-team { border-top: 1px solid rgba(255,255,255,0.07); }
  .bk-seed {
    flex: none;
    width: 22px; height: 22px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(10px, 0.85vw, 13px); font-weight: 800;
    color: rgba(var(--cream-rgb),0.5);
    background: rgba(255,255,255,0.06);
  }
  .bk-team .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bk-team .sc { flex: none; font-weight: 800; min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
  .bk-team.win { color: var(--gold); }
  .bk-team.win .sc { color: var(--gold); }
  .bk-team.win .bk-seed { background: linear-gradient(180deg, var(--gold), var(--gold-dim)); color: var(--dark); }
  .bk-team.win::before {
    content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 62%; background: var(--gold); box-shadow: 0 0 12px var(--gold);
  }
  .bk-team.lose { color: rgba(var(--cream-rgb),0.42); }
  .bk-team.lose .sc { color: rgba(var(--cream-rgb),0.42); }
  .bk-live-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--terra);
    margin-right: 6px;
    animation: liveGlow 1s ease-in-out infinite alternate;
  }
  /* ── 챔피언 노드 ── */
  .bk-champ-col {
    flex: 0 0 auto;
    min-width: 236px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
    z-index: 1;
  }
  .bk-champ .cup {
    font-size: clamp(34px, 3.4vw, 52px);
    filter: drop-shadow(0 4px 16px rgba(var(--gold-rgb),0.5));
    animation: bkFloat 3s ease-in-out infinite;
  }
  @keyframes bkFloat { 50% { transform: translateY(-6px); } }
  .bk-champ .clabel {
    font-size: clamp(11px, 1vw, 15px); letter-spacing: 6px; font-weight: 800;
    color: var(--gold); text-transform: uppercase; margin-top: 6px;
  }
  .bk-champ .cbox {
    position: relative; overflow: hidden;
    margin-top: 12px; padding: 16px 20px; border-radius: 12px; min-width: 200px;
    background: linear-gradient(180deg, rgba(var(--gold-rgb),0.16), rgba(var(--gold-rgb),0.04));
    border: 1px solid rgba(var(--gold-rgb),0.55);
    box-shadow: 0 0 40px rgba(var(--gold-rgb),0.28), inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .bk-champ .cbox::after {
    content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-18deg); animation: bkShine 3.5s ease-in-out infinite;
  }
  @keyframes bkShine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .bk-champ .cbox.pending {
    border-color: rgba(var(--gold-rgb),0.28); background: rgba(var(--gold-rgb),0.05); box-shadow: none;
  }
  .bk-champ .cbox.pending::after { display: none; }
  .bk-champ .cname { font-size: clamp(18px, 1.9vw, 28px); font-weight: 900; color: #fff; }
  .bk-champ .cbox.pending .cname { font-size: clamp(15px, 1.5vw, 22px); color: rgba(var(--cream-rgb),0.6); }
  .bk-champ .cmeta { font-size: clamp(10px, 0.82vw, 13px); letter-spacing: 3px; color: var(--gold); margin-top: 6px; text-transform: uppercase; }



  /* ══════════════ 통합 순위 테이블 ══════════════ */
  .bk-standings { width: 100%; }
  .bk-table {
    width: 100%;
    border-collapse: collapse;
    color: var(--cream);
  }
  .bk-table th {
    font-size: clamp(11px, 1.1vw, 16px);
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(var(--cream-rgb),0.5);
    padding: 6px 10px;
    text-align: center;
    border-bottom: 1px solid rgba(var(--gold-rgb),0.3);
  }
  .bk-table th.l, .bk-table td.l { text-align: left; }
  .bk-table td {
    font-size: clamp(18px, 2.2vw, 34px);
    font-weight: 700;
    padding: 8px 10px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    line-height: 1.1;
  }
  .bk-table td.nm { font-weight: 800; }
  .bk-table td.rk { color: rgba(var(--cream-rgb),0.7); width: 1%; white-space: nowrap; }
  .bk-table td.grp { color: rgba(var(--cream-rgb),0.4); font-size: clamp(13px, 1.4vw, 22px); }
  .bk-table td.gw { color: var(--gold); }
  .bk-table tr.top td { background: rgba(var(--gold-rgb),0.1); }
  .bk-table tr.top td.rk::before { content: '★'; color: var(--gold); margin-right: 6px; font-size: 0.8em; }
  .bk-bye {
    margin-left: 10px;
    font-size: clamp(11px, 1.1vw, 16px);
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--gold);
    text-transform: uppercase;
    vertical-align: middle;
  }

  /* ══════════════ 전체 뷰 (점수판 + 순위 + 대진표/조별) — 키 4 ══════════════
   * 좌 700px = 타이틀·라이브 점수판·통합순위 / 우 나머지 = 대진표 or 조별 스테이지.
   * 1920x1080 한 화면에 셋 다 들어가야 하고, 우측은 스크롤 없이 전부 보여야 한다.
   * .bracket-panel 을 display:contents 로 풀어 자식(순위/우측패널)을 직접 그리드에 앉힌다. */
  body.view-all {
    display: grid;
    grid-template-columns: 700px minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    align-items: start;
    justify-content: center;
    gap: 0 24px;
    padding: 20px 24px;
    height: 100vh;
  }
  body.view-all .sb-wrap       { grid-column: 1; grid-row: 1; width: 700px; }
  body.view-all .bracket-panel { display: contents; }
  body.view-all .bk-head       { grid-column: 1; grid-row: 2; padding: 14px 4px 6px; }
  /* align-self:stretch — body 가 align-items:start 라 안 주면 내용 높이에 붙어 아래가 빈다 */
  body.view-all .bk-standings  { grid-column: 1; grid-row: 3; align-self: stretch;
                                 min-height: 0; overflow: hidden; }
  body.view-all #bkRight       { grid-column: 2; grid-row: 1 / span 3; align-self: stretch;
                                 height: 100%; min-height: 0;
                                 display: flex; flex-direction: column; }

  /* ── 좌: 점수판을 700px 폭에 맞춰 [이름] 위 / [세트·포인트] 아래 2단으로 접는다 ── */
  body.view-all .sb-title      { padding: 0 22px; height: 74px; }
  body.view-all .sb-title-text { font-size: 31px; letter-spacing: 2.5px;
                                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.view-all .sb-header     { grid-template-columns: 1fr 1fr 1fr 1.4fr; height: 32px;
                                 padding: 0 24px; align-items: center; }
  body.view-all .sb-header-cell:first-child { display: none; }
  body.view-all .sb-header-cell { font-size: 15px; }
  body.view-all .sb-row        { grid-template-columns: 1fr 1fr 1fr 1.4fr;
                                 grid-template-rows: 48px 110px;
                                 min-height: 0; height: 194px; padding: 14px 24px; }
  body.view-all .sb-name       { grid-column: 1 / -1; grid-row: 1; }
  body.view-all .sb-name span  { font-size: 42px; }
  body.view-all .serve-icon    { width: 22px; height: 22px;
                                 box-shadow: 0 0 14px rgba(var(--gold-rgb),0.85); }
  body.view-all .sb-cell       { grid-row: 2; }
  body.view-all .sb-cell.set          { font-size: 76px; }
  body.view-all .sb-cell.set.current  { font-size: 96px; }
  body.view-all .sb-cell.point        { font-size: 100px; }

  /* STAR/GOLDEN 배너 — absolute 로 두면 순위표를 덮는다. 흐름 안으로 넣고 압축. */
  body.view-all .star-banner,
  body.view-all .gold-banner   { position: static; padding: 8px 20px; }
  body.view-all .star-banner-text,
  body.view-all .gold-banner-text { font-size: 24px; letter-spacing: 6px; }

  /* ── 좌하: 통합 순위. table{height:100%} 라 팀 수가 몇이든 남는 높이를 행이 나눠 갖는다
   *    (5팀이면 널널하게, 12팀이면 눌러서 — 잘리거나 스크롤 생기지 않게). ── */
  body.view-all .bk-standings .bk-table { height: 100%; width: 700px; }
  body.view-all .bk-table th   { height: 32px; font-size: 13px; padding: 0 8px; }
  body.view-all .bk-table td   { height: auto; font-size: 22px; padding: 2px 8px; }
  body.view-all .bk-table td.nm { font-size: 24px; max-width: 300px;
                                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.view-all .bk-table td.grp { font-size: 16px; }
  body.view-all .bk-bye          { font-size: 13px; }

  /* ── 우: 대진표/조별 패널이 세로를 꽉 채우되 넘치지 않게.
   *    패널 테두리는 #bkRight 한 곳에만 (대진표든 조별이든 같은 상자 안에 담기게). ── */
  body.view-all #bkRight        { padding: 18px;
                                  background: rgba(0,0,0,0.22);
                                  border: 1px solid rgba(var(--gold-rgb),0.22);
                                  border-radius: 14px; }
  body.view-all #bkBracketTitle { margin: 0 0 8px 4px !important;
                                  font-size: clamp(18px, 1.9vw, 26px); letter-spacing: 5px; }
  body.view-all .bk-cols        { flex: 1; min-height: 0; height: 100%;
                                  overflow: hidden; align-items: stretch; }

  /* ══════════════ 조별 스테이지 (knockout 생성 전) ══════════════
   * 조 = 칼럼, 경기 = 한 칸 [번호·시각 | 홈 / 원정]. 라운드로는 묶지 않는다.
   * 높이를 flex 로 나눠 경기 수가 달라도 스크롤 없이 전부 들어간다. */
  /* 바깥 테두리는 감싸는 쪽(전체 뷰의 #bkRight)이 갖는다 — 여긴 레이아웃만.
   * 높이는 auto 가 기본: '대진표' 뷰의 하단 패널은 높이가 안 정해져 있어서
   * height:100% 를 걸면 통째로 찌그러진다. 높이가 고정된 전체 뷰에서만 꽉 채운다. */
  .gs-panel {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
  }
  body.view-all .gs-panel { height: 100%; }

  /* '대진표' 뷰(하단 패널)도 남는 높이 안에서만 그리게 — 조별 10경기가 화면 밖으로 넘치던 것 */
  .gs-panel-head { flex: none; display: flex; align-items: baseline; gap: 16px; padding: 0 4px 8px; }
  .gs-panel-head .bk-title { font-size: clamp(18px, 1.9vw, 26px); letter-spacing: 5px; }
  /* flex-basis 를 auto 로 — 높이 auto 인 부모(대진표 뷰)에선 내용만큼, 고정 높이(전체 뷰)에선 꽉 차게 */
  .gs-body { flex: 1 1 auto; min-height: 0; margin-top: 8px; display: flex; gap: 24px; }
  .gs-col {
    flex: 1 1 0; min-width: 0; min-height: 0;
    padding: 14px; display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(18,58,66,0.5), rgba(7,27,32,0.7));
    border: 1px solid rgba(var(--gold-rgb),0.18);
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .gs-col.livecol { border-color: rgba(var(--live-rgb),0.35); }
  .gs-col-head {
    flex: none; margin-bottom: 8px; padding: 0 4px 8px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid rgba(var(--gold-rgb),0.28);
  }
  .gs-col-name  { font-size: clamp(16px, 1.7vw, 24px); font-weight: 900; letter-spacing: 5px;
                  color: var(--gold); text-transform: uppercase; }
  .gs-col-state {
    margin-left: auto; flex: none;
    font-size: clamp(11px, 1.1vw, 15px); font-weight: 700; letter-spacing: 2px;
    padding: 3px 10px; border-radius: 5px;
    color: rgba(var(--cream-rgb),0.6); background: rgba(255,255,255,0.06);
    font-variant-numeric: lining-nums tabular-nums;
  }
  .gs-col-state.on { color: #fff; background: var(--terra); box-shadow: 0 2px 10px rgba(var(--live-rgb),0.45); }
  /* 경기 목록 — 라운드 소제목 없이 번호 순으로 이어진다 */
  /* min-height 는 2줄이 들어가는 최소치. 6팀 조(15경기)까지 스크롤 없이 들어간다.
     overflow:hidden 은 마지막 보루 — TV엔 스크롤바가 없다. */
  /* 행 사이 간격을 없애고 구분선으로만 나눈다 — 번호 거터의 세로선이 끊기지 않고 이어져
     '표의 한 열' 로 읽힌다. 예전엔 gap 6px 때문에 세로선이 토막나 보였다. */
  .gs-list { flex: 1 1 auto; min-height: 0; overflow: hidden;
             display: flex; flex-direction: column; }
  .gs-m {
    position: relative;
    flex: 1 1 auto; min-height: 44px; max-height: 150px;
    display: grid;
    grid-template-columns: 66px minmax(0, 1fr);
    grid-template-rows: 1fr 1fr;
    align-items: center;
    /* 세로 패딩 0 — .no 의 세로 헤어라인이 행 위아래 끝까지 닿아야 열처럼 보인다 */
    padding: 0 10px;
    border-bottom: 1px solid rgba(var(--cream-rgb),0.16);
  }
  .gs-m:last-child { border-bottom: none; }
  /* 매치번호 = 거터의 맨 숫자 (번호 위 · 시각 아래 · LIVE/NEXT 그 아래).
     시드 칩(.bk-seed)으로 오독되지 않게 배경·테두리 없이 세로 헤어라인으로만 나눈다. */
  .gs-m .no {
    grid-row: 1 / span 2; align-self: stretch;
    display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 3px;
    padding-right: 13px; border-right: 1px solid rgba(var(--gold-rgb),0.22); line-height: 1;
  }
  .gs-m .no b { font-size: clamp(20px, 2vw, 34px); font-weight: 400; color: rgba(var(--cream-rgb),0.5); }
  .gs-m .no i {
    font-style: normal; font-size: clamp(11px, 1.1vw, 15px); font-weight: 600;
    letter-spacing: 0.8px; color: rgba(var(--cream-rgb),0.32);
  }
  /* 홈·원정을 위아래로 — 조 칼럼이 좁아 한 줄에 두 이름을 넣으면 한글 페어 이름이 잘린다 */
  .gs-m .side {
    display: grid; grid-template-columns: minmax(0, 1fr) 46px;
    align-items: center; gap: 10px; padding-left: 13px; height: 100%;
  }
  /* 홈/원정 사이는 경기 구분선보다 훨씬 옅게 — 안 그러면 두 줄이 별개 경기처럼 보이고
     가운데 번호가 어느 쪽 것인지 헷갈린다. */
  .gs-m .side + .side { border-top: 1px solid rgba(var(--cream-rgb),0.045); }
  .gs-m .tn {
    font-size: clamp(14px, 1.45vw, 28px); line-height: 1; color: rgba(var(--cream-rgb),0.88);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gs-m .sc {
    text-align: right; font-size: clamp(16px, 1.7vw, 32px); font-weight: 700; line-height: 1;
    color: rgba(var(--cream-rgb),0.34);
  }
  /* 완료 — 승자 골드 / 패자 dim */
  .gs-m.done .tn.w, .gs-m.done .sc.w { color: var(--gold-hi); font-weight: 700; }
  .gs-m.done .tn.l, .gs-m.done .sc.l { color: rgba(var(--cream-rgb),0.34); }
  /* 예정 — 전체 dim */
  .gs-m.soon .tn   { color: rgba(var(--cream-rgb),0.34); }
  .gs-m.soon .no b { color: rgba(var(--cream-rgb),0.34); }
  /* LIVE — 번호만 테라코타 솔리드 + 행 왼쪽 세로 바 (§3-9) */
  .gs-m.live { background: rgba(var(--live-rgb),0.12); }
  .gs-m.live::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--terra);
  }
  .gs-m.live .tn   { color: #fff; font-weight: 700; }
  .gs-m.live .sc   { color: #fff; }
  .gs-m.live .no b { background: var(--terra); color: #fff; border-radius: 2px; padding: 1px 9px; }
  .gs-m.live .no i { color: rgba(var(--cream-rgb),0.6); }
  /* 배지는 거터 안 — 점수칸을 건드리지 않는다 */
  .gs-livebadge, .gs-nextbadge {
    margin-top: 5px; font-size: clamp(9px, 0.9vw, 13px); font-weight: 700; letter-spacing: 1.4px;
    padding: 1px 6px; border-radius: 2px;
  }
  .gs-livebadge { background: var(--terra); color: #fff; display: flex; align-items: center; gap: 4px; }
  .gs-livebadge .dot { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: bkBlink 0.9s steps(2) infinite; }
  .gs-nextbadge { border: 1px solid rgba(var(--gold-rgb),0.45); color: var(--gold); }
  /* ── 조별 순위 (A조 / B조 각각) ──
   * 넓은 '순위' 뷰에서는 좌우로, 폭이 700px 뿐인 전체 뷰에서는 위아래로 놓는다. */
  .bk-groups { display: flex; gap: 20px; align-items: flex-start; }
  .bk-group  { flex: 1 1 0; min-width: 0; }
  .bk-group-name {
    font-size: clamp(14px, 1.5vw, 20px); font-weight: 900; letter-spacing: 4px;
    color: var(--gold); text-transform: uppercase; padding: 0 4px 4px;
  }
  body.view-all .bk-groups { flex-direction: column; height: 100%; gap: 6px; }
  body.view-all .bk-group  { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  body.view-all .bk-group-name { font-size: 17px; letter-spacing: 3px; padding-bottom: 2px; }
  /* 진출선 — 이 줄 아래로는 녹아웃에 못 간다(각 조 상위 4팀) */
  .bk-table tr.cut td { border-bottom: 2px dashed rgba(var(--gold-rgb),0.55); }
  /* 시드 뱃지에 'A1' 처럼 조 문자가 들어가므로 폭을 내용에 맞춘다 */
  .bk-seed { width: auto; min-width: 22px; padding: 0 5px; }

  /* 순위표 LIVE 행 — 지금 코트에 있는 팀 */
  .bk-table tr.liverow td { background: rgba(var(--live-rgb),0.10); }
  .bk-table tr.liverow td.rk::before { content: '\25CF'; color: var(--terra); margin-right: 5px; font-size: 0.6em; vertical-align: middle; }

  /* ── 캡스 라벨·뱃지·표 머리는 산세리프 (§2: PWA/TV 본문 = Inter·system).
     본문 서체가 세리프라 이 목록만 되돌린다. ── */
  .sb-header-cell, .bk-title, .bk-sub, .bk-table th, .bk-group-name,
  .gs-col-name, .gs-col-state, .gs-livebadge, .gs-nextbadge,
  .bk-livebadge, .bk-champ .clabel, .bk-champ .cmeta, .bk-seed, .bk-bye,
</style>
</head>
<body>

<div class="sb-wrap">

  <!-- 타이틀 -->
  <div class="sb-title">
    <div class="sb-title-text" id="tvTitle">PS i-League</div>
  </div>

  <!-- 헤더 -->
  <div class="sb-header">
    <div class="sb-header-cell">선수</div>
    <div class="sb-header-cell">SET 1</div>
    <div class="sb-header-cell">SET 2</div>
    <div class="sb-header-cell">SET 3</div>
    <div class="sb-header-cell">POINT</div>
  </div>

  <!-- 팀 행 -->
  <div class="sb-teams">
    <div class="sb-row" id="tvRowA">
      <div class="sb-name">
        <span id="tvNameA">Team A</span>
        <div class="serve-icon"></div>
      </div>
      <div class="sb-cell set current" id="tvSetA1"></div>
      <div class="sb-cell set"         id="tvSetA2"></div>
      <div class="sb-cell set"         id="tvSetA3"></div>
      <div class="sb-cell point"       id="tvPointA">0</div>
    </div>

    <hr class="sb-divider">

    <div class="sb-row" id="tvRowB">
      <div class="sb-name">
        <span id="tvNameB">Team B</span>
        <div class="serve-icon"></div>
      </div>
      <div class="sb-cell set current" id="tvSetB1"></div>
      <div class="sb-cell set"         id="tvSetB2"></div>
      <div class="sb-cell set"         id="tvSetB3"></div>
      <div class="sb-cell point"       id="tvPointB">0</div>
    </div>
  </div>

  <!-- 배너 -->
  <div class="star-banner" id="tvStarBanner">
    <div class="star-banner-text">✦&nbsp;&nbsp;STAR POINT&nbsp;&nbsp;✦</div>
  </div>
  <div class="gold-banner" id="tvGoldBanner">
    <div class="gold-banner-text">👑&nbsp;&nbsp;GOLDEN POINT&nbsp;&nbsp;👑</div>
  </div>

</div>

<!-- 뷰는 '전체' 하나뿐 — 전환 버튼·키 없음. 대회 데이터가 없으면 점수판만 남는다. -->

<!-- ── 하단 패널 (통합순위 / 대진표) ──
     'all' 뷰에서는 .bracket-panel 이 display:contents 로 풀려서
     #bkStandings 는 좌측 컬럼, #bkRight 는 우측 컬럼으로 각각 그리드에 앉는다. -->
<div class="bracket-panel" id="bracketPanel">
  <div class="bk-head">
    <div class="bk-title" id="bkTitle"></div>
    <div class="bk-sub" id="bkSub"></div>
  </div>
  <div class="bk-standings" id="bkStandings"></div>
  <div id="bkRight">
    <div class="bk-round-label" id="bkBracketTitle" style="text-align:left;letter-spacing:2px;border:none;margin:14px 6px 8px;color:var(--gold)"></div>

<!-- 빌드 표시 — TV가 최신 파일을 로드했는지 육안 확인용 (캐시 판별). -->
<!--TVBUILD:b12--><div id="tvBuild" style="position:fixed;left:8px;bottom:6px;z-index:9999;font:600 12px/1 Inter,sans-serif;color:rgba(255,255,255,.35);letter-spacing:1px;pointer-events:none;">TV b12 · 자동갱신</div>
<script>
// 자동 업데이트 — 서버의 tv.html 빌드가 바뀌면 스스로 새로고침(키오스크 무인 갱신, ?x= 불필요).
(function () {
  var BUILD = "b12"; // ⚠️ 배포마다 위 <!--TVBUILD:xx--> 와 함께 증가시킬 것
  function check() {
    fetch(location.pathname + "?_ts=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (html) {
        if (!html) return;
        var m = html.match(/TVBUILD:([A-Za-z0-9._]+)/);
        if (m && m[1] && m[1] !== BUILD) location.reload();
      })
      .catch(function () {});
  }
  setInterval(check, 120000); // 2분마다 확인
  // 탭이 다시 보일 때(TV 절전 복귀 등)도 즉시 확인
  document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
})();
</script>

<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyBkrib1qzN8IE9NcW8tXTfKb4Z6JsOjcvE",
    authDomain:        "ps-score-868bb.firebaseapp.com",
    databaseURL:       "https://ps-score-868bb-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "ps-score-868bb",
    storageBucket:     "ps-score-868bb.firebasestorage.app",
    messagingSenderId: "48470302084",
    appId:             "1:48470302084:web:b037acc0b58f7e85d191d1"
  };

  firebase.initializeApp(firebaseConfig);
  const db  = firebase.database();
  const ref = db.ref('scoreboard');
  const dot = document.getElementById('connDot');

  const POINTS = ['0','15','30','40','AD'];

  let prevPA = 0, prevPB = 0;

  function pop(el) {
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }

  function setCell(elId, val, classes) {
    const el = document.getElementById(elId);
    el.textContent = val;
    el.className = 'sb-cell ' + classes;
  }

  ref.on('value', snap => {
    dot.classList.add('on');
    const S = snap.val();
    if (!S) return;

    document.getElementById('tvTitle').textContent = S.title || '';
    document.getElementById('tvNameA').textContent = S.a?.name || '';
    document.getElementById('tvNameB').textContent = S.b?.name || '';

    // 서브권
    document.getElementById('tvRowA').classList.toggle('serving', !!S.a?.serving);
    document.getElementById('tvRowB').classList.toggle('serving', !!S.b?.serving);

    // 포인트
    const starMode = !!S.starPoint;
    const sets = (S.a?.sets||[]).length;
    const isTB = S.a?.game === 6 && S.b?.game === 6;
    const isSuperTB = !!S.superTB && sets === 2;
    const useRaw = isTB || isSuperTB;
    const DISP = useRaw ? null : (starMode ? ['0','15','30','40','⭐'] : POINTS);
    const ptA = useRaw ? (S.a?.point ?? 0) : (DISP[S.a?.point] ?? S.a?.point ?? '0');
    const ptB = useRaw ? (S.b?.point ?? 0) : (DISP[S.b?.point] ?? S.b?.point ?? '0');
    const elPA = document.getElementById('tvPointA');
    const elPB = document.getElementById('tvPointB');
    if ((S.a?.point ?? 0) !== prevPA) { pop(elPA); prevPA = S.a?.point ?? 0; }
    if ((S.b?.point ?? 0) !== prevPB) { pop(elPB); prevPB = S.b?.point ?? 0; }
    elPA.textContent = ptA;
    elPB.textContent = ptB;

    // 세트
    const curSet = (S.a?.sets || []).length;
    for (let i = 0; i < 3; i++) {
      const aEl = document.getElementById(`tvSetA${i+1}`);
      const bEl = document.getElementById(`tvSetB${i+1}`);
      if (i < curSet) {
        aEl.textContent = S.a.sets[i];
        bEl.textContent = S.b.sets[i];
        aEl.className = 'sb-cell set has-score';
        bEl.className = 'sb-cell set has-score';
      } else if (i === curSet) {
        aEl.textContent = S.a?.game ?? 0;
        bEl.textContent = S.b?.game ?? 0;
        aEl.className = 'sb-cell set current';
        bEl.className = 'sb-cell set current';
      } else {
        aEl.textContent = '';
        bEl.textContent = '';
        aEl.className = 'sb-cell set';
        bEl.className = 'sb-cell set';
      }
    }

    // 배너
    document.getElementById('tvStarBanner').classList.toggle('visible', starMode);
    document.getElementById('tvGoldBanner').classList.toggle('visible', !!S.goldenPoint);
  });

  // 연결 상태 표시 — 'disconnect'는 유효한 RTDB 이벤트가 아니라 (기존 버그: 여기서
  // throw되어 이후 스크립트 전체가 죽었음) 공식 .info/connected 경로로 감지한다.
  db.ref('.info/connected').on('value', (snap) => {
    dot.classList.toggle('on', !!snap.val());
  });

  /* ══════════════ 대진표 (토너먼트 스토어 폴링) ══════════════
   * 데이터: GET {API}/tournament-store/tournaments (공개 read, 15초 폴링)
   * 토글 우선순위: RTDB scoreboard.showBracket(리모컨) > 로컬(B키/클릭/?bracket=)
   * URL 파라미터:
   *   ?tid=<토너먼트 id>  특정 대회 고정 (생략 시 진행중 대회 자동 선택)
   *   ?bracket=0          시작 시 숨김
   *   ?api=<base>         API 베이스 오버라이드 (기본 https://api.padelsociety.co.kr/api)
   */
  const bkQS   = new URLSearchParams(location.search);
  const BK_API = bkQS.get('api') || 'https://api.padelsociety.co.kr/api';
  const BK_TID = bkQS.get('tid') || null;

  // ── 뷰는 '전체' 하나뿐: 점수판 + 조별 순위 + 조별 스테이지를 한 화면에.
  // 대회 데이터가 없으면(bkTournament == null) 자동으로 점수판만 남는다(bkApply).
  // 전환 버튼·키(1·2·3·4·B)·?view=·localStorage 는 없앴다.
  const BK_VIEWS = ['all'];
  function bkNormView(v){ return BK_VIEWS.includes(v) ? v : null; }
  const bkView = 'all';

  // ── 테마: 럭셔리(기본) / 클래식 ──
  // 우선순위: ?theme= (키오스크 URL 로 못박기) > RTDB scoreboard.tvTheme (콘솔 리모컨)
  //          > localStorage (T 키로 바꾼 값) > 'luxury'
  const BK_THEMES = ['luxury', 'classic'];
  function bkNormTheme(v) { v = String(v || '').toLowerCase(); return BK_THEMES.includes(v) ? v : null; }
  const bkThemeFixed = bkNormTheme(bkQS.get('theme'));
  let bkThemeRemote = null;
  let bkThemeLocal = 'luxury';
  try { bkThemeLocal = bkNormTheme(localStorage.getItem('tvTheme')) || 'luxury'; } catch (e) {}

  function bkApplyTheme() {
    const t = bkThemeFixed || bkThemeRemote || bkThemeLocal;
    document.body.classList.toggle('theme-classic', t === 'classic');
  }
  function bkSetTheme(t) {
    t = bkNormTheme(t); if (!t) return;
    bkThemeLocal = t;
    try { localStorage.setItem('tvTheme', t); } catch (e) {}
    bkApplyTheme();
  }
  bkApplyTheme();   // Firebase 응답 전에 먼저 입혀서 깜빡임을 막는다

  // 현장에서 TV 앞에 서서 바꿔야 할 때 — T 키로 토글 (콘솔이 리모컨으로 잡고 있으면 그쪽이 이긴다)
  document.addEventListener('keydown', (e) => {
    if (e.key === 't' || e.key === 'T' || e.key === 'ㅅ') bkSetTheme(bkThemeLocal === 'classic' ? 'luxury' : 'classic');
  });
  let bkTournament = null;   // 마지막으로 선택된 대회
  // 지금 코트에서 뛰는 팀 — RTDB 점수판의 팀명·현재 게임스코어.
  // 조별 경기엔 live 플래그가 없어서, 이름이 일치하는 경기를 LIVE 로 물린다.
  let bkLiveA = '', bkLiveB = '', bkLiveGA = 0, bkLiveGB = 0;

  const bkPanel = document.getElementById('bracketPanel');

  function bkEffView(){ return bkView; }

  function bkApply() {
    // 대회를 못 잡으면 점수판만 (조별 순위·스테이지를 그릴 데이터가 없다)
    const panelOn = !!bkTournament;
    document.body.classList.toggle('bracket-on', panelOn);
    document.body.classList.toggle('view-all', panelOn);
    if (bkTournament) bkRender(bkTournament);
  }

  // 뷰가 하나뿐이라 RTDB 의 tvView·showBracket 리모컨은 더 이상 읽지 않는다.
  // (콘솔이 예전 값을 계속 써도 무시된다 — 지울 필요 없음)
  ref.on('value', (snap) => {
    const S = snap.val() || {};
    bkThemeRemote = bkNormTheme(S.tvTheme);
    bkApplyTheme();
    // 조별 스테이지에서 지금 뛰는 경기를 짚기 위한 팀명·현재 게임스코어
    bkLiveA  = ((S.a && S.a.name) || '').trim();
    bkLiveB  = ((S.b && S.b.name) || '').trim();
    bkLiveGA = (S.a && S.a.game) || 0;
    bkLiveGB = (S.b && S.b.game) || 0;
    bkApply();
  });

  // ── 팀 id → 이름 (registrations / groups.teams / americano·special players) ──
  function bkNameOf(t, id) {
    if (!id) return 'TBD';
    const reg = (t.registrations || []).find((r) => r.id === id);
    if (reg) return reg.teamName || reg.playerName || '?';
    for (const g of (t.groups || [])) {
      const tm = (g.teams || []).find((x) => x.id === id);
      if (tm) return tm.name;
      const pl = (g.players || []).find((x) => x.id === id);
      if (pl) return pl.name;
    }
    for (const src of [t.americanoData, t.specialData]) {
      const p = (src && src.players || []).find((x) => x.id === id);
      if (p) return p.name;
    }
    return String(id);
  }

  // 지금 코트에 있는 팀/선수인가 — RTDB 점수판 팀명과 대조해 순위표 행을 빨갛게 물린다.
  // 셀렉션(개인전)은 점수판 이름이 "A · B" 페어라 조각으로도 맞춰본다.
  // 운영자가 점수판 이름을 다르게 타이핑하면 강조만 안 될 뿐, 순위·경기 표시는 그대로다.
  function bkIsOnCourt(name) {
    const n = String(name || '').trim();
    if (!n) return false;
    const parts = (s) => String(s || '').split(/·|&/).map((x) => x.trim()).filter(Boolean);
    return [bkLiveA, bkLiveB].some((side) => {
      const s = String(side || '').trim();
      return s && (s === n || parts(s).includes(n));
    });
  }

  // 순위 계산 — tournament-app.js calcStandings 이식 (승/이긴 게임/진 게임).
  function bkStandingsOf(teams, rounds) {
    const stats = {};
    (teams || []).forEach((t) => { stats[t.id] = { team: t, played: 0, wins: 0, losses: 0, draws: 0, gamesWon: 0, gamesLost: 0 }; });
    (rounds || []).forEach((rd) => (rd || []).forEach((m) => {
      if (!m.completed) return;
      const h = stats[m.home], a = stats[m.away];
      if (!h || !a) return;
      h.played++; a.played++;
      h.gamesWon += m.homeScore; h.gamesLost += m.awayScore;
      a.gamesWon += m.awayScore; a.gamesLost += m.homeScore;
      if (m.homeScore > m.awayScore) { h.wins++; a.losses++; }
      else if (m.homeScore < m.awayScore) { a.wins++; h.losses++; }
      else { h.draws++; a.draws++; }
    }));
    return Object.values(stats);
  }

  // 정렬 규칙 (앱 calcStandings 와 동일):
  //   ① 이긴 매치 수(승) → ② 이긴 게임 합 → ③ 서로 전적(맞대결 게임 득실)
  // 셋 다 같으면 0 을 돌려 원래 순서를 유지한다(앱도 같다).
  function bkCmpRows(h2h) {
    return (a, b) => {
      if ((b.wins || 0) !== (a.wins || 0)) return (b.wins || 0) - (a.wins || 0);
      if ((b.gamesWon || 0) !== (a.gamesWon || 0)) return (b.gamesWon || 0) - (a.gamesWon || 0);
      const ia = a.team && a.team.id, ib = b.team && b.team.id;
      return (h2h[ib] && h2h[ib][ia]) || 0;   // 양수면 b 가 맞대결에서 앞섰다는 뜻
    };
  }

  // 맞대결 게임 득실 — h2h[a][b] = a 가 b 상대로 낸 (딴 게임 - 준 게임) 합.
  // tournament-app.js calcStandings 와 같은 정의(승패 수가 아니라 게임 마진).
  function bkH2HInto(rounds, h2h) {
    (rounds || []).forEach((rd) => (rd || []).forEach((m) => {
      if (!m.completed || m.home == null || m.away == null) return;
      const d = (m.homeScore || 0) - (m.awayScore || 0);
      (h2h[m.home] || (h2h[m.home] = {}))[m.away] = ((h2h[m.home] || {})[m.away] || 0) + d;
      (h2h[m.away] || (h2h[m.away] = {}))[m.home] = ((h2h[m.away] || {})[m.home] || 0) - d;
    }));
  }

  // 두 조 통합 순위.
  // 기본 = 앱 calcStandings 와 동일: ① 이긴 매치 수(승) → ② 이긴 게임 합 → ③ 서로 전적.
  // 예외 = 7팀 스페셜(maxTeams=7)만 앱 rankSpecial7 과 동일: 이긴 게임 → 득실차 → 승.
  //   3팀조는 2경기, 4팀조는 3경기라 승수를 1순위로 쓰면 4팀조가 유리해서다.
  //   이 순위가 앱에서 8강 시드(1위 부전승)를 정하므로 TV 도 같은 규칙을 써야 표와 대진이 안 어긋난다.
  // ⚠️ 예전엔 7팀 규칙을 모든 대회에 적용해서 승수가 3순위로 밀려 있었다.
  function bkOverallStandings(t) {
    const rows = [];
    const h2h = {};
    (t.groups || []).forEach((g) => {
      bkH2HInto(g.rounds, h2h);
      bkStandingsOf(g.teams, g.rounds).forEach((s) => rows.push({ ...s, groupName: g.name }));
    });
    if (parseInt(t.maxTeams, 10) === 7) {
      rows.sort((a, b) => {
        if ((b.gamesWon || 0) !== (a.gamesWon || 0)) return (b.gamesWon || 0) - (a.gamesWon || 0);
        const da = (a.gamesWon || 0) - (a.gamesLost || 0), db = (b.gamesWon || 0) - (b.gamesLost || 0);
        if (db !== da) return db - da;
        return (b.wins || 0) - (a.wins || 0);
      });
      return rows;
    }
    rows.sort(bkCmpRows(h2h));
    return rows;
  }

  // 조별 순위 — 조마다 따로 매긴다. 이게 정본이다.
  // 앱은 8·10팀 8강을 A1-B4, A3-B2, B1-A4, B3-A2 로 만들고(tournament-app.js advanceToKnockout),
  // 4·5팀은 단일 조 상위 4로 4강(1-4, 2-3)을 만든다. 어느 쪽도 통합 순위를 쓰지 않는다.
  // 통합 순위를 쓰는 건 7팀 스페셜뿐이다(rankSpecial7 → 1위 부전승).
  function bkGroupStandings(t) {
    return (t.groups || []).map((g) => {
      const h2h = {};
      bkH2HInto(g.rounds, h2h);
      const rows = bkStandingsOf(g.teams, g.rounds);
      rows.sort(bkCmpRows(h2h));
      return { name: g.name || '', rows };
    });
  }

  // 셀렉션(개인전) 순위 — tournament-app calcAmericanoStandings 이식.
  // 이긴 게임(자기 팀 점수 합) 우선, 동점 시 승수 — 앱의 통과자 선정과 동일 기준이라 순위가 일치.
  function bkSpecialStandings(t) {
    const sd = t.specialData || {};
    const rows = [];
    (sd.groups || []).forEach((g) => {
      const stats = {};
      (g.players || []).forEach((p) => { stats[p.id] = { player: p, played: 0, wins: 0, losses: 0, gamesWon: 0 }; });
      (g.rounds || []).forEach((round) => (round || []).forEach((m) => {
        if (!m.completed) return;
        const t1Win = (m.team1Score || 0) > (m.team2Score || 0);
        const t2Win = (m.team2Score || 0) > (m.team1Score || 0);
        (m.team1 || []).forEach((pid) => { const s = stats[pid]; if (s) { s.gamesWon += m.team1Score || 0; s.played++; if (t1Win) s.wins++; else if (t2Win) s.losses++; } });
        (m.team2 || []).forEach((pid) => { const s = stats[pid]; if (s) { s.gamesWon += m.team2Score || 0; s.played++; if (t2Win) s.wins++; else if (t1Win) s.losses++; } });
      }));
      Object.values(stats).forEach((s) => rows.push({ ...s, groupName: g.name }));
    });
    rows.sort((a, b) => (b.gamesWon !== a.gamesWon) ? b.gamesWon - a.gamesWon : b.wins - a.wins);
    return rows;
  }

  // 셀렉션 순위표 — 요청대로 승 / 패 / 이긴 게임만 (개인전이라 득실·진게임 생략).
  function bkRenderSpecialStandings(t) {
    const rows = bkSpecialStandings(t);
    const multiGroup = ((t.specialData || {}).groups || []).length > 1;
    document.getElementById('bkTitle').textContent = t.title || t.name || '';
    bkStandingsLabel = '순위';
    document.getElementById('bkSub').textContent = '순위 · 승 / 패 / 이긴 게임';
    const box = document.getElementById('bkStandings');
    if (!rows.length) { box.innerHTML = ''; return; }
    box.innerHTML = `
      <table class="bk-table">
        <thead>
          <tr>
            <th class="l">#</th>
            <th class="l">선수</th>
            ${multiGroup ? '<th>조</th>' : ''}
            <th>승</th>
            <th>패</th>
            <th>이긴 게임</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((s, i) => `
            <tr class="${bkIsOnCourt(s.player && s.player.name) ? 'liverow' : ''}">
              <td class="rk">${i + 1}</td>
              <td class="nm l">${s.player.name}</td>
              ${multiGroup ? `<td class="grp">${s.groupName}</td>` : ''}
              <td>${s.wins}</td>
              <td>${s.losses}</td>
              <td class="gw">${s.gamesWon}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }

  // 순위표 한 벌. opt.bye = 1위에 '8강 부전승' (7팀 스페셜),
  //                opt.cut = 이 등수 아래로 진출선(점선) — 상위 N 이 녹아웃에 간다.
  function bkStandingsTable(rows, opt) {
    opt = opt || {};
    return `
      <table class="bk-table">
        <thead>
          <tr>
            <th class="l">#</th>
            <th class="l">선수 · 팀</th>
            <th>경기</th>
            <th>승</th>
            <th>이긴 게임</th>
            <th>득실</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((s, i) => {
            const diff = (s.gamesWon || 0) - (s.gamesLost || 0);
            const cls = [
              opt.bye && i === 0 ? 'top' : '',
              opt.cut && i === opt.cut - 1 && rows.length > opt.cut ? 'cut' : '',
              bkIsOnCourt(s.team && s.team.name) ? 'liverow' : '',
            ].filter(Boolean).join(' ');
            return `
            <tr class="${cls}">
              <td class="rk">${i + 1}</td>
              <td class="nm l">${s.team.name}${opt.bye && i === 0 ? '<span class="bk-bye">8강 부전승</span>' : ''}</td>
              <td>${s.played}</td>
              <td>${s.wins}</td>
              <td class="gw">${s.gamesWon}</td>
              <td class="gw">${diff > 0 ? '+' + diff : diff}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  // 지금 순위표가 무엇인지 — 전체 뷰 좌측 제목이 이 값을 쓴다('통합 순위'가 아닐 수 있다).
  let bkStandingsLabel = '순위';

  function bkRenderStandings(t) {
    // 셀렉션(개인전)은 승/패/이긴게임만 — 별도 렌더.
    if (t.specialData && (t.specialData.groups || []).length) { bkRenderSpecialStandings(t); return; }
    const maxT = parseInt(t.maxTeams, 10);
    const box = document.getElementById('bkStandings');
    document.getElementById('bkTitle').textContent = t.title || t.name || '';

    // 7팀 스페셜만 통합 순위 — 앱이 통합 1~7위로 8강(1위 부전승)을 만들기 때문.
    if (maxT === 7) {
      const rows = bkOverallStandings(t);
      bkStandingsLabel = '통합 순위';
      document.getElementById('bkSub').textContent = '통합 순위 · 1~7위';
      box.innerHTML = rows.length ? bkStandingsTable(rows, { bye: true }) : '';
      return;
    }

    // 그 외는 조별로 따로. 8·10팀은 A1-B4, A3-B2, B1-A4, B3-A2 로 붙으므로
    // 두 조를 섞은 통합 순위는 대진과 아무 상관이 없다.
    // ⚠️ 예전엔 7팀 전용 통합 순위를 모든 대회에 그려서 A·B조가 한 표에 섞여 나왔다.
    const gs = bkGroupStandings(t).filter((g) => g.rows.length);
    if (!gs.length) { box.innerHTML = ''; return; }
    const multi = gs.length > 1;
    bkStandingsLabel = multi ? '조별 순위' : '순위';
    document.getElementById('bkSub').textContent = multi ? '조별 순위 · 각 조 상위 4팀 진출' : '순위';
    box.innerHTML = `<div class="bk-groups">${gs.map((g) => `
      <div class="bk-group">
        ${multi ? `<div class="bk-group-name">${(g.name || '').length <= 2 ? g.name + '조' : g.name}</div>` : ''}
        ${bkStandingsTable(g.rows, { cut: 4 })}
      </div>`).join('')}</div>`;
  }

  const BK_ROUND_LABEL = { 1: 'FINAL', 2: 'SEMIFINAL', 4: 'QUARTERFINAL', 8: 'ROUND OF 16', 16: 'ROUND OF 32' };
  const BK_ROUND_KO    = { 1: '결승', 2: '4강', 4: '8강', 8: '16강', 16: '32강' };

  // 대진표 카드에 붙는 시드 표기.
  // 2개 조 대회는 조내 순위 = 'A1', 'B4' — 앱 대진이 A1-B4, A3-B2, B1-A4, B3-A2 라
  // 조 문자 없이 숫자만 쓰면 어느 조 몇 등인지 알 수 없다(예전엔 통합 등수를 찍었다).
  // 7팀 스페셜과 셀렉션(개인전)은 통합/개인 순위 숫자 그대로.
  function bkSeedOf(t, id) {
    if (!id) return '';
    if (!t.__seedMap) {
      const map = {};
      const gs = bkGroupStandings(t);
      if (parseInt(t.maxTeams, 10) === 7 || gs.length <= 1) {
        bkOverallStandings(t).forEach((s, i) => { if (s.team) map[s.team.id] = i + 1; });
      } else {
        gs.forEach((g) => g.rows.forEach((s, i) => {
          if (s.team) map[s.team.id] = String(g.name || '') + (i + 1);
        }));
      }
      if (t.specialData && t.specialData.groups) {
        bkSpecialStandings(t).forEach((s, i) => { if (s.player) map[s.player.id] = i + 1; });
      }
      t.__seedMap = map;
    }
    return t.__seedMap[id] || '';
  }

  function bkMatchHTML(t, m) {
    const proj = !!m.projected;   // 예상 대진(점수 없음)
    const done = !proj && !!m.completed;
    const live = !proj && !!m.live && !done;
    const hs = (m.homeScore ?? m.team1Score);
    const as = (m.awayScore ?? m.team2Score);
    const hWin = done && hs > as, aWin = done && as > hs;
    const hId = m.home != null ? m.home : (m.team1 && m.team1[0]);
    const aId = m.away != null ? m.away : (m.team2 && m.team2[0]);
    const hName = m.home != null ? bkNameOf(t, m.home)
      : (m.team1 || []).map((id) => bkNameOf(t, id)).join(' · ') || 'TBD';
    // 예상 부전승: 상대 슬롯이 비면 BYE 표기
    const aName = (proj && m.home != null && m.away == null) ? '부전승'
      : m.away != null ? bkNameOf(t, m.away)
      : (m.team2 || []).map((id) => bkNameOf(t, id)).join(' · ') || 'TBD';
    const sc = (v) => (proj || v == null ? '' : v);
    const seedTag = (id) => { const s = bkSeedOf(t, id); return s ? `<span class="bk-seed">${s}</span>` : ''; };
    const cls = 'bk-match' + (live ? ' live' : done ? ' done' : '');
    const head = live ? `<div class="bk-livebadge"><i></i>LIVE</div>`
      : (m.matchTime ? `<div class="bk-time">${m.matchTime}</div>` : '');
    return `<div class="${cls}" data-done="${done ? 1 : 0}">
      ${head}
      <div class="bk-team${hWin ? ' win' : ''}${aWin ? ' lose' : ''}">${seedTag(hId)}<span class="nm">${hName}</span><span class="sc">${sc(hs)}</span></div>
      <div class="bk-team${aWin ? ' win' : ''}${hWin ? ' lose' : ''}">${seedTag(aId)}<span class="nm">${aName}</span><span class="sc">${sc(as)}</span></div>
    </div>`;
  }

  // 챔피언 노드 — 결승(마지막 라운드 단일 경기) 완료 시 우승자, 아니면 '대기'.
  function bkChampHTML(t, kb) {
    const finalRd = kb.rounds[kb.rounds.length - 1];
    const fm = finalRd && finalRd.length === 1 ? finalRd[0] : null;
    let name = '', decided = false;
    if (fm && fm.completed) {
      const hs = fm.homeScore ?? fm.team1Score, as = fm.awayScore ?? fm.team2Score;
      const winIds = hs > as ? (fm.home != null ? [fm.home] : (fm.team1 || []))
                             : (fm.away != null ? [fm.away] : (fm.team2 || []));
      name = winIds.map((id) => bkNameOf(t, id)).join(' · ');
      decided = !!name;
    }
    return `<div class="bk-col bk-champ-col">
      <div class="bk-champ">
        <div class="cup">🏆</div>
        <div class="clabel">Champion</div>
        ${decided ? `<div class="cbox"><div class="cname">${name}</div><div class="cmeta">우승</div></div>` : ''}
      </div>
    </div>`;
  }

  // 라운드 연결선(엘보) — 레이아웃 후 각 경기 위치를 실측해 그림.
  let bkConnRaf = 0, bkConnResizeBound = false;
  function bkQueueConnectors() {
    if (!bkConnResizeBound) { window.addEventListener('resize', bkQueueConnectors); bkConnResizeBound = true; }
    cancelAnimationFrame(bkConnRaf);
    bkConnRaf = requestAnimationFrame(() => requestAnimationFrame(bkDrawConnectors));
    setTimeout(bkDrawConnectors, 450); // 폰트 로드 후 재보정
  }
  function bkDrawConnectors() {
    const cols = document.getElementById('bkCols');
    const svg = cols && cols.querySelector('svg.bk-conns');
    if (!svg) return;
    const kko = Array.from(cols.querySelectorAll('.bk-col.kko'));
    const champBox = cols.querySelector('.bk-champ-col .cbox');
    const base = cols.getBoundingClientRect();
    const sl = cols.scrollLeft, st = cols.scrollTop;
    const W = cols.scrollWidth, H = cols.scrollHeight;
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const C = (el) => { const r = el.getBoundingClientRect(); return {
      l: r.left - base.left + sl, r: r.right - base.left + sl, y: r.top - base.top + st + r.height / 2 }; };
    const GOLD = 'var(--gold)', DIM = 'rgba(var(--gold-rgb),0.28)';
    const seg = (d, done) => `<path d="${d}" fill="none" stroke="${done ? GOLD : DIM}" stroke-width="${done ? 3 : 2}" stroke-linecap="round" stroke-linejoin="round"${done ? '' : ' stroke-dasharray="2 6"'}/>`;
    let paths = '';
    for (let r = 0; r < kko.length - 1; r++) {
      const kids = Array.from(kko[r].querySelectorAll('.bk-col-inner .bk-match'));
      const parents = Array.from(kko[r + 1].querySelectorAll('.bk-col-inner .bk-match'));
      parents.forEach((pEl, k) => {
        const p = C(pEl);
        [kids[2 * k], kids[2 * k + 1]].forEach((cEl) => {
          if (!cEl) return;
          const c = C(cEl);
          const midX = (c.r + p.l) / 2;
          const done = cEl.getAttribute('data-done') === '1';
          paths += seg(`M ${c.r} ${c.y} H ${midX} V ${p.y} H ${p.l}`, done);
        });
      });
    }
    if (champBox && kko.length) {
      const last = Array.from(kko[kko.length - 1].querySelectorAll('.bk-col-inner .bk-match'));
      const fEl = last.length === 1 ? last[0] : null;
      if (fEl) {
        const f = C(fEl), ch = C(champBox);
        const midX = (f.r + ch.l) / 2;
        const done = fEl.getAttribute('data-done') === '1';
        paths += seg(`M ${f.r} ${f.y} H ${midX} V ${ch.y} H ${ch.l}`, done);
      }
    }
    svg.innerHTML = paths;
  }

  // 8강 아직 없을 때: 현재 통합순위로 예상 대진 투영 (7팀 스페셜 시드 [1,·,4,5,2,7,3,6], 1위 부전승)
  function bkProjectedRounds(t) {
    const maxT = parseInt(t.maxTeams, 10);
    const ranked = bkOverallStandings(t).map((s) => s.team.id);
    if (maxT === 7 && ranked.length >= 7) {
      const s = ranked;
      // 표준 8강 시드 [1,8,4,5,3,6,2,7] → 8강 (1/8, 4/5, 3/6, 2/7)
      const slots = [s[0], null, s[3], s[4], s[2], s[5], s[1], s[6]];
      const qf = [];
      for (let i = 0; i < 8; i += 2) qf.push({ home: slots[i], away: slots[i + 1], projected: true });
      return [qf, [{ projected: true }, { projected: true }], [{ projected: true }]];
    }
    return null;
  }

  /* ══════════════ 조별 스테이지 (knockout 생성 전) ══════════════
   * 조 = 칼럼, 경기 = 한 칸 [번호·시각 | 홈 / 원정]. 라운드로는 묶지 않는다.
   * 조별 경기 객체엔 live 플래그가 없어서(필드: id/home/away/homeScore/awayScore/completed/court/matchTime)
   * RTDB 점수판의 팀명과 일치하는 미완료 경기를 LIVE 로 본다. 이름이 안 맞으면 강조만 빠진다.  */
  function bkPairName(t, m, side) {
    const id = side === 'h' ? m.home : m.away;
    const arr = side === 'h' ? m.team1 : m.team2;
    if (id != null) return bkNameOf(t, id);
    return (arr || []).map((x) => bkNameOf(t, x)).join(' · ') || 'TBD';
  }

  function bkIsLiveMatch(t, m) {
    if (m.completed || !bkLiveA || !bkLiveB) return false;
    const h = bkPairName(t, m, 'h').trim(), a = bkPairName(t, m, 'a').trim();
    return (h === bkLiveA && a === bkLiveB) || (h === bkLiveB && a === bkLiveA);
  }

  function bkGroupRowHTML(t, m, no, isNext) {
    const live = bkIsLiveMatch(t, m);
    const done = !!m.completed;
    const hName = bkPairName(t, m, 'h'), aName = bkPairName(t, m, 'a');
    // LIVE 경기 점수는 저장값이 아직 없으니 RTDB 현재 게임스코어를 쓴다(홈/원정 순서 맞춰서).
    const flip = live && hName.trim() === bkLiveB;
    const hs = live ? (flip ? bkLiveGB : bkLiveGA) : (m.homeScore != null ? m.homeScore : m.team1Score);
    const as = live ? (flip ? bkLiveGA : bkLiveGB) : (m.awayScore != null ? m.awayScore : m.team2Score);
    const hW = done && hs > as, aW = done && as > hs;
    const cls = done ? 'done' : live ? 'live' : 'soon';
    const badge = live ? '<span class="gs-livebadge"><span class="dot"></span>LIVE</span>'
                : isNext ? '<span class="gs-nextbadge">NEXT</span>' : '';
    // 점수는 끝났거나 뛰는 중일 때만. 예정 경기는 '–'.
    const sc = (v) => ((done || live) ? (v != null ? v : 0) : '–');
    const side = (name, v, win, lose) => {
      const k = win ? 'w' : lose ? 'l' : '';
      return `<div class="side"><span class="tn ${k}">${name}</span><span class="sc ${k}">${sc(v)}</span></div>`;
    };
    return `<div class="gs-m ${cls}">
      <div class="no"><b>${no}</b><i>${m.matchTime || '--:--'}</i>${badge}</div>
      ${side(hName, hs, hW, aW)}
      ${side(aName, as, aW, hW)}
    </div>`;
  }

  function bkGroupStageHTML(t) {
    const src = (t.groups && t.groups.length) ? t.groups
              : ((t.specialData && t.specialData.groups) || []);
    const groups = src.map((g, i) => ({ name: g.name || String(i + 1), rounds: g.rounds || [] }));
    if (!groups.length) return '';

    // NEXT = 아직 안 끝났고 LIVE 도 아닌 경기 중 matchTime 이 가장 이른 것 (대회 전체 기준, 1개만)
    let nextKey = null, nextTime = null;
    groups.forEach((g, gi) => g.rounds.flat().forEach((m, i) => {
      if (m.completed || bkIsLiveMatch(t, m)) return;
      const tm = m.matchTime || '99:99';
      if (nextTime === null || tm < nextTime) { nextTime = tm; nextKey = gi + '.' + i; }
    }));

    const all   = groups.reduce((a, g) => a.concat(g.rounds.flat()), []);
    const doneN = all.filter((m) => m.completed).length;

    const cols = groups.map((g, gi) => {
      const ms = g.rounds.flat();
      const gDone = ms.filter((m) => m.completed).length;
      const gLive = ms.some((m) => bkIsLiveMatch(t, m));
      const label = g.name.length <= 2 ? 'GROUP ' + g.name : g.name;
      const state = gLive ? '진행중' : (gDone === ms.length && ms.length) ? '완료' : '대기';
      return `<div class="gs-col${gLive ? ' livecol' : ''}">
        <div class="gs-col-head">
          <div class="gs-col-name">${label}</div>
          <div class="gs-col-state${gLive ? ' on' : ''}">${state} ${gDone}/${ms.length}</div>
        </div>
        <div class="gs-list">${ms.map((m, i) =>
          bkGroupRowHTML(t, m, i + 1, nextKey === gi + '.' + i)).join('')}</div>
      </div>`;
    }).join('');

    return `<div class="gs-panel">
      <div class="gs-panel-head">
        <div class="bk-title">Group Stage</div>
        <div class="bk-sub">${groups.length}개 조 · ${all.length}경기 · ${doneN}완료</div>
      </div>
      <div class="gs-body">${cols}</div>
    </div>`;
  }

  function bkRenderBracket(t) {
    const cols = document.getElementById('bkCols');
    const kb = t.knockoutBracket;
    const bkTitle = document.getElementById('bkBracketTitle');

    const kkoCol = (rd, third) => `
        <div class="bk-col kko">
          <div class="bk-round-label">${BK_ROUND_LABEL[rd.length] || 'ROUND'}${BK_ROUND_KO[rd.length] ? `<small>${BK_ROUND_KO[rd.length]}</small>` : ''}</div>
          <div class="bk-col-inner">${rd.map((m) => bkMatchHTML(t, m)).join('')}</div>
          ${third ? `<div class="bk-third"><div class="bk-round-label">3RD PLACE<small>3·4위전</small></div>${bkMatchHTML(t, third)}</div>` : ''}
        </div>`;

    if (kb && Array.isArray(kb.rounds) && kb.rounds.length) {
      if (bkTitle) bkTitle.textContent = 'KNOCKOUT';
      const lastIdx = kb.rounds.length - 1;
      // 3·4위전은 결승 칼럼 하단에 배치(연결선이 가로지르지 않게)
      let html = kb.rounds.map((rd, ri) => kkoCol(rd, ri === lastIdx ? kb.thirdPlaceMatch : null)).join('');
      html += bkChampHTML(t, kb);
      cols.innerHTML = '<svg class="bk-conns"></svg>' + html;
      bkQueueConnectors();
      return true;
    }

    // 8강 미생성 → 예상 대진 투영 (있으면)
    const proj = bkProjectedRounds(t);
    if (proj) {
      if (bkTitle) bkTitle.textContent = '예상 대진 · 현재 순위 기준';
      cols.innerHTML = '<svg class="bk-conns"></svg>' + proj.map((rd) => kkoCol(rd)).join('') + bkChampHTML(t, { rounds: proj });
      bkQueueConnectors();
      return true;
    }

    // 투영 불가(7팀 아님/데이터 부족) → 조별 스테이지: 경기 순서(matchTime)와 결과
    // 팀전(groups)·셀렉션(specialData.groups) 둘 다 bkGroupStageHTML 한 곳에서 처리한다.
    const gsHTML = bkGroupStageHTML(t);
    if (gsHTML) {
      // 패널이 자기 머리에 'Group Stage' 를 달고 나오므로 위 라벨은 비운다(중복 방지)
      if (bkTitle) bkTitle.textContent = '';
      cols.innerHTML = gsHTML;
      return true;
    }
    cols.innerHTML = '';
    return false;
  }

  function bkRender(t) {
    const v = bkEffView();
    const all = v === 'all';                       // 전체 뷰 = 순위 + 대진표/조별 동시에
    const showStandings = all || v === 'standings';
    const showBracket   = all || v === 'bracket';
    document.getElementById('bkTitle').textContent = t.title || t.name || '';
    document.getElementById('bkStandings').style.display = showStandings ? '' : 'none';
    document.getElementById('bkRight').style.display = showBracket ? '' : 'none';
    document.getElementById('bkBracketTitle').style.display = showBracket ? '' : 'none';
    document.getElementById('bkCols').style.display = showBracket ? '' : 'none';
    if (showStandings) bkRenderStandings(t);
    else document.getElementById('bkSub').textContent = '';
    if (showBracket) bkRenderBracket(t);
    // 전체 뷰: 좌측 머리는 '통합 순위' + 어느 대회인지(대회명 · 종별 · 날짜).
    // 이걸 띄워두는 건 취향이 아니라 안전장치다 — 엉뚱한 대회를 잡으면 화면만 봐도
    // 바로 드러난다. 종별까지 적는 건 같은 날 '자유 브실골플'과 '혼복 브론즈+'가
    // 나란히 열려 대회명만으론 구분이 안 되기 때문이다(2026-09-05 실제로 헷갈렸다).
    if (all) {
      const d = String(t.date || '').slice(0, 10).split('-');
      const cat = [BK_CAT[t.categoryGender], BK_CAT[t.categoryLevel]].filter(Boolean).join(' ');
      document.getElementById('bkTitle').textContent = bkStandingsLabel;
      document.getElementById('bkSub').textContent =
        [t.name || t.title || '', cat, d.length === 3 ? d[1] + '/' + d[2] : ''].filter(Boolean).join(' · ');
    }
  }

  // 종별 라벨 — tournament-app.js 의 한국어 라벨과 같은 표기.
  const BK_CAT = {
    menDoubles: '남복', womenDoubles: '여복', mixedDoubles: '혼복', openDoubles: '자유',
    beginner: '비기너', beginnerPlus: '비기너+',
    bronzeMinus: '브론즈-', bronze: '브론즈', bronzePlus: '브론즈+',
    silverMinus: '실버-', silver: '실버', silverPlus: '실버+',
    goldMinus: '골드-', gold: '골드', goldPlus: '골드+',
    platinumMinus: '플레티넘-', platinum: '플레티넘', platinumPlus: '플레티넘+',
    bronzeToPlatinum: '브실골플',   // 브론즈~플래티넘 전 등급 통합
  };

  // 오늘 날짜(TV 로컬) "YYYY-MM-DD" — 대회 date 필드와 같은 모양으로 맞춘다.
  function bkTodayStr() {
    const d = new Date(), p = (n) => (n < 10 ? '0' : '') + n;
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  // 이 대회에 등록된 팀/선수 이름 전부 — 지금 코트에 있는 두 팀이 이 대회 소속인지 보려고.
  function bkAllNames(t) {
    const out = [];
    (t.registrations || []).forEach((r) => out.push(r.teamName || r.playerName));
    (t.groups || []).forEach((g) => {
      (g.teams || []).forEach((x) => out.push(x.name));
      (g.players || []).forEach((x) => out.push(x.name));
    });
    [t.americanoData, t.specialData].forEach((s) => (((s || {}).players) || []).forEach((p) => out.push(p.name)));
    return out.map((n) => String(n || '').trim()).filter(Boolean);
  }

  function bkPick(items) {
    if (!Array.isArray(items)) return null;
    // 순위/대진표 모두 조(groups)가 있어야 표시 가능 (대진표는 조가 없어도 knockout 있으면 OK).
    // 'score' 뷰라도 대회는 잡아둔다(버튼으로 언제든 전환 가능하게).
    const hasDraw = (t) =>
      (t.groups && t.groups.length) ||
      (t.knockoutBracket && (t.knockoutBracket.rounds || []).length) ||
      (t.specialData && (t.specialData.groups || []).length); // 셀렉션(5/10/12명 개인전)도 표시 대상
    if (BK_TID) return items.find((t) => t.id === BK_TID && hasDraw(t)) || null;
    const drawable = items.filter(hasDraw);
    if (!drawable.length) return null;

    // ⚠️ 예전엔 '배열에서 처음 만나는 미완료 대회'였다. 진행중 대회가 둘 이상이면
    //    배열 앞쪽이 이겨서, 내일 대회가 오늘 대회를 가로챘다(2026-09-05 실제 발생).
    //    이제 점수로 고른다: 진행중(4) + 오늘 날짜(2) + 지금 코트의 두 팀이 이 대회 소속(1).
    //    date 는 타임존 없는 "YYYY-MM-DD" 평문이라 문자열 그대로 비교한다.
    const today = bkTodayStr();
    const scoreOf = (t) => {
      let s = 0;
      if (t.stage !== 'completed' && t.stage !== 'registration') s += 4;
      if (String(t.date || '').slice(0, 10) === today) s += 2;
      if (bkLiveA && bkLiveB) {
        const names = bkAllNames(t);
        if (names.indexOf(bkLiveA) >= 0 && names.indexOf(bkLiveB) >= 0) s += 1;
      }
      return s;
    };
    let best = drawable[0], bestS = -1;
    drawable.forEach((t) => { const s = scoreOf(t); if (s >= bestS) { best = t; bestS = s; } }); // 동점이면 뒤(최근 생성) 우선
    return best;
  }

  async function bkPoll() {
    try {
      const res = await fetch(`${BK_API}/tournament-store/tournaments`, { headers: { Accept: 'application/json' } });
      if (res.ok) {
        const json = await res.json();
        const raw = json && json.data && json.data.data;
        const items = raw ? JSON.parse(raw) : [];
        const picked = bkPick(items);
        bkTournament = picked;
        if (picked) bkRender(picked);
        bkApply();
      }
    } catch (e) { /* 네트워크 일시 오류 — 다음 폴링에서 복구 */ }
    setTimeout(bkPoll, 15000);
  }
  bkPoll();
</script>
</body>
</html>
