<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Live Banner – OBS Overlay</title>
<style>
  /* 라이브 위 띠(2026-11-13 · 사용자 "화면 위쪽에 얇은 배너 만들자. PS 9th Open 에 대한거" · "배너는 원래 이렇게 했었어" —
     8th Open 때 띠: 흰 바탕에 'Padel Society' 필기체 로고 + 아래 오른쪽 'Nth Open' 을 가로로 다섯 번).
     OBS 브라우저 소스(너비 1920 · 높이 48)로 방송 화면 맨 위에 얹는다. 움직이지 않는다(늘 떠 있는 띠라 경기에서 눈을 뺏지 않게).
     기본은 **초록 바탕 + 크림 로고·글씨**(2026-11-13 · 사용자 "띠 바탕색을 초록색으로 하고 로고색과 대회명을 바꿔볼까?") —
     초록 #104734 · 크림 #F3DAB2 = 공개 사이트 brand/logo-green.png · logo-cream.png 의 색, 로고는 그 둘의 필기체 부분(brand/script-*.png).
     8th Open 때 모양(흰 바탕 + 초록 로고)은 ?theme=white.
     주소로 바꿀 수 있다: ?text=9th%20Open(로고 아래 글) · ?n=5(몇 번) · ?theme=white · ?bg=fff(바탕 · 6자리/3자리 hex) */
  @font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/IBMPlexSansKR-Bold.woff2') format('woff2')}
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --fg:#F3DAB2; --bg:#104734; }
  :root.white { --fg:#104734; --bg:#FFFFFF; }
  html, body { background:transparent; width:100%; height:48px; overflow:hidden; }
  body { font-family:'IBM Plex Sans KR',system-ui,sans-serif; }

  .bar {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:space-around;
    background:var(--bg);
  }
  .item { position:relative; height:48px; width:104px; flex:none; }
  .item img { position:absolute; left:0; top:2px; width:102px; height:auto; }   /* 102 → 높이 30 · 바로 아래 글과 붙는다 */
  .item .ed {
    position:absolute; right:0; bottom:1px;
    font-size:16px; font-weight:700; line-height:1; color:var(--fg); white-space:nowrap;
  }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<script>
  const q = new URLSearchParams(location.search);
  const text = q.get('text') || '9th Open';
  const n = Math.min(12, Math.max(1, parseInt(q.get('n'), 10) || 5));
  const white = q.get('theme') === 'white';
  if (white) document.documentElement.classList.add('white');
  const logo = white ? 'brand/script-green.png' : 'brand/script-cream.png';
  const bg = (q.get('bg') || '').replace(/[^0-9a-fA-F]/g, '');
  if (bg.length === 3 || bg.length === 6) document.documentElement.style.setProperty('--bg', '#' + bg);

  const bar = document.getElementById('bar');
  for (let i = 0; i < n; i++) {
    const it = document.createElement('div');
    it.className = 'item';
    const img = document.createElement('img');
    img.src = logo;
    img.alt = i === 0 ? 'Padel Society' : '';
    const ed = document.createElement('div');
    ed.className = 'ed';
    ed.textContent = text; // 글자로 넣는다 — 주소의 글이 HTML 이 되지 않게
    it.append(img, ed);
    bar.appendChild(it);
  }
</script>
</body>
</html>
