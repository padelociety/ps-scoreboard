<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Live Banner – OBS Overlay</title>
<style>
  /* 라이브 위 띠(2026-11-13) — OBS 브라우저 소스 **1920 x 48** · 방송 화면 맨 위.
     사용자 "화면 위쪽에 얇은 배너 만들자. PS 9th Open 에 대한거" → "배너는 원래 이렇게 했었어"(8th Open: 흰 바탕 + 필기체 로고 반복)
     → "띠 바탕색을 초록색으로" → "더 좋은 아이디어 없어? 움직여도 돼 ticker처럼".
     기본(티커): 왼쪽 고정 칸 = 필기체 로고 + '9th Open'(크림 · 진한 초록) · 오른쪽 = 소식이 오른쪽에서 왼쪽으로 흐른다(TICKER · 끊김 없이 돈다).
     색 = 공개 사이트 로고의 초록 #104734 · 크림 #F3DAB2(brand/logo-green.png · logo-cream.png). 소식 사이 점은 금색.
     ⚠️ prefers-reduced-motion 을 따르지 않는다(ads.html 과 같은 이유 — 방송 PC 설정이 방송 화면을 바꾸면 안 된다).
     소식은 **방송 중에 폰으로 바꾼다** — banner-edit.html 이 Firebase scoreboard.ticker 에 적고 여기서 곧바로 다시 그린다(비우면 아래 TICKER).
     **늘 떠 있지 않다**(같은 날 · 사용자 "이것도 계속 나오는게 아니라 5분에 한번 나오는거 하자!") — 10분마다 내려와 소식을 한 바퀴 다 흘리고 올라간다
     (처음엔 5초 뒤 · ?every=600 초 · ?first=5 · ?always=1 = 늘 떠 있음(OBS 자리 잡기)) · 폰에서 소식을 바꾸면 그 자리에서 한 번 내려와 보여 준다.
     소식 안 표시: **굵게** = 흰 글자 · [[PS10]] = 금색 칩(할인 코드처럼 받아 적을 글자).
     주소: ?speed=70(초당 px) · ?text=9th%20Open · ?lines=첫%20소식|둘째%20소식 · ?style=repeat(예전 반복 띠 · ?theme=white 면 흰 바탕) · ?n=5 */
  @font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/IBMPlexSansKR-SemiBold.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans KR';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/IBMPlexSansKR-Bold.woff2') format('woff2')}
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --fg:#F3DAB2; --bg:#104734; --bg2:#0B3627; --gold:#D9BC7A; }
  :root.white { --fg:#104734; --bg:#FFFFFF; }
  html, body { background:transparent; width:100%; height:48px; overflow:hidden; }
  body { font-family:'IBM Plex Sans KR',system-ui,sans-serif; font-variant-numeric: lining-nums tabular-nums; }

  .bar { position:absolute; inset:0; display:flex; align-items:center; background:var(--bg); overflow:hidden;
         transition: transform .7s cubic-bezier(.2,.9,.25,1), opacity .5s ease; }
  .bar.off { transform:translateY(-100%); opacity:0; }   /* 쉬는 동안은 위로 숨는다(투명 소스라 방송엔 아무것도 없다) */

  /* ── 반복 띠(?style=repeat) ── */
  .bar.repeat { justify-content:space-around; }
  .item { position:relative; height:48px; width:104px; flex:none; }
  .item img { position:absolute; left:0; top:2px; width:102px; height:auto; }   /* 102 → 높이 30 · 바로 아래 글과 붙는다 */
  .item .ed { position:absolute; right:0; bottom:1px; font-size:16px; font-weight:700; line-height:1; color:var(--fg); white-space:nowrap; }

  /* ── 티커(기본) ── */
  .tag {
    position:relative; z-index:2; flex:none; height:48px;
    display:flex; align-items:center; gap:12px;
    padding:0 26px 0 24px;
    background:var(--bg2);
    box-shadow:6px 0 12px rgba(0,0,0,.35);
  }
  .tag::after {                       /* 오른쪽 금줄 */
    content:''; position:absolute; right:0; top:9px; bottom:9px; width:2px; background:var(--gold); border-radius:1px;
  }
  .tag img { height:30px; width:auto; display:block; }
  .tag .ed { font-size:20px; font-weight:700; color:var(--fg); white-space:nowrap; line-height:1; padding-top:4px; }

  .run { position:relative; flex:1; min-width:0; height:48px; overflow:hidden;
         -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%);
                 mask-image:linear-gradient(90deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%); }
  .track { position:absolute; left:0; top:0; height:48px; display:flex; align-items:center; white-space:nowrap; will-change:transform;
           animation: run var(--dur, 60s) linear infinite; }
  @keyframes run { from{transform:translateX(0)} to{transform:translateX(-50%)} }   /* 같은 줄을 두 번 이어 붙여 끊김 없이 */
  .msg { font-size:19px; font-weight:600; color:var(--fg); }
  .msg b { font-weight:700; color:#FFFFFF; }
  .msg .code { display:inline-block; margin-left:6px; padding:1px 10px 2px; border-radius:6px; background:var(--gold); color:var(--bg2);
               font-weight:700; letter-spacing:.06em; line-height:1.3; }   /* [[코드]] — 할인 코드처럼 받아 적을 글자 */
  .sep { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--gold); margin:0 34px; flex:none; transform:translateY(1px); }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<script type="module">
  // 기본 소식은 여기 한 곳. 사실만 — 기간·장소는 대회 데이터(공개 사이트 PS 9th Open), 센터 줄은 ads.html ADS 와 같은 말. **굵게** 는 흰 글자.
  const TICKER = [
    '**PS 9th Open** · 11.13 – 11.22 · 빠델소사이어티',
    '대진표 · 실시간 결과는 **Playus 앱** › 대회에서',
    '빠델소사이어티 2호점 **빠델소사이어티 아카데미** · 김포 통진 · 실내 코트 2면 · 2026년 12월 오픈 예정',
    '빠델소사이어티 3호점 **빠델소사이어티 대전** · 대전 와동 · 실내 코트 1면 · 2027년 1월 오픈 예정',
    '**파피용** · NOX 10% 할인 · papiyong.com · 할인 코드 [[PS10]]',   // 대회 PWA live.html ADS 와 같은 말
  ];

  // obs.html 과 같은 프로젝트(점수판 RTDB).
  const FIREBASE = {
    apiKey: 'AIzaSyBkrib1qzN8IE9NcW8tXTfKb4Z6JsOjcvE',
    authDomain: 'ps-score-868bb.firebaseapp.com',
    databaseURL: 'https://ps-score-868bb-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId: 'ps-score-868bb',
    storageBucket: 'ps-score-868bb.firebasestorage.app',
    messagingSenderId: '48470302084',
    appId: '1:48470302084:web:b037acc0b58f7e85d191d1',
  };

  const q = new URLSearchParams(location.search);
  const text = q.get('text') || '9th Open';
  const urlLines = q.get('lines') ? q.get('lines').split('|').map((s) => s.trim()).filter(Boolean) : null;
  let lines = urlLines || TICKER;
  const speed = Math.min(300, Math.max(20, Number(q.get('speed')) || 70));   // 초당 px
  const repeat = q.get('style') === 'repeat';
  const white = q.get('theme') === 'white';
  if (white) document.documentElement.classList.add('white');
  const logo = white ? 'brand/script-green.png' : 'brand/script-cream.png';
  const bg = (q.get('bg') || '').replace(/[^0-9a-fA-F]/g, '');
  if (bg.length === 3 || bg.length === 6) document.documentElement.style.setProperty('--bg', '#' + bg);

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const rich = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[\[(.+?)\]\]/g, '<span class="code">$1</span>');   // 이스케이프한 뒤에만 — 주소의 글이 HTML 이 되지 않게
  const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
  const bar = document.getElementById('bar');

  if (repeat) {
    bar.classList.add('repeat');
    const n = Math.min(12, Math.max(1, parseInt(q.get('n'), 10) || 5));
    for (let i = 0; i < n; i++) {
      const it = el('div', 'item');
      const img = el('img'); img.src = logo; img.alt = i === 0 ? 'Padel Society' : '';
      const ed = el('div', 'ed'); ed.textContent = text;
      it.append(img, ed); bar.appendChild(it);
    }
  } else {
    const tag = el('div', 'tag');
    const img = el('img'); img.src = 'brand/script-cream.png'; img.alt = 'Padel Society';
    const ed = el('div', 'ed'); ed.textContent = text;
    tag.append(img, ed);
    const run = el('div', 'run');
    const track = el('div', 'track');
    run.appendChild(track); bar.append(tag, run);
    // 한 벌 = 소식 + 점 … 을 화면보다 길게 채운 뒤 두 번 이어 붙인다 → -50% 까지 흘리면 처음과 똑같은 자리.
    const one = () => { const f = document.createDocumentFragment(); for (const l of lines) { const m = el('span', 'msg'); m.innerHTML = rich(l); f.append(m, el('span', 'sep')); } return f; };
    let setWidth = 0;
    const build = () => {
      track.textContent = '';
      const half = el('div'); half.style.display = 'flex'; half.style.alignItems = 'center';
      half.appendChild(one());
      track.appendChild(half);
      setWidth = half.scrollWidth;   // 소식 한 벌의 폭 — 한 바퀴 시간을 잰다
      while (half.scrollWidth < run.clientWidth + 200) half.appendChild(one());
      track.appendChild(half.cloneNode(true));
      track.style.setProperty('--dur', (half.scrollWidth / speed).toFixed(2) + 's');   // 길이와 상관없이 같은 빠르기
    };
    build();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);   // 글꼴이 실린 뒤 폭이 바뀐다

    // ── 나타났다 들어가기 — 5분마다 한 번 · 소식 한 바퀴(모든 소식이 화면을 한 번 지나간다) 동안 ──
    const always = q.get('always') === '1';
    const every = Math.max(60, Number(q.get('every')) || 600);   // 기본 10분(2026-11-13 사용자 "10분에 한번으로 바꾸자" — 처음엔 5분)
    const firstAt = q.has('first') ? Math.max(0, Number(q.get('first')) || 0) : 5;
    let hideT = null;
    const passSeconds = () => Math.max(20, (setWidth + run.clientWidth) / speed);   // 처음 보인 글자부터 마지막 소식이 왼쪽 끝을 지날 때까지
    function appear() {
      clearTimeout(hideT);
      track.style.animation = 'none'; void track.offsetWidth; track.style.animation = '';   // 처음 소식부터
      bar.classList.remove('off');
      hideT = setTimeout(() => bar.classList.add('off'), passSeconds() * 1000);
    }
    if (!always) {
      bar.classList.add('off');
      setTimeout(() => { appear(); setInterval(appear, every * 1000); }, firstAt * 1000);
    }
    window.__bannerAppear = appear;   // 소식이 바뀌면 한 번 보여 준다(아래)

    // 방송 중 소식 바꾸기 — scoreboard.ticker(banner-edit.html). 주소에 ?lines= 를 줬으면 그게 이긴다.
    // Firebase 를 못 불러와도 띠는 기본 소식으로 살아 있다(obs.html 과 같은 방식).
    if (!urlLines) (async () => {
      try {
        const [{ initializeApp }, { getDatabase, ref, onValue }] = await Promise.all([
          import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
          import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js'),
        ]);
        const db = getDatabase(initializeApp(FIREBASE));
        let last = '';
        onValue(ref(db, 'scoreboard/ticker'), (snap) => {
          const v = snap.val();
          const got = Array.isArray(v) ? v.map((x) => String(x || '').trim()).filter(Boolean).slice(0, 12) : [];
          const next = got.length ? got : TICKER;
          const key = JSON.stringify(next);
          if (key === last) return;      // 같은 소식이면 흐르던 자리를 그대로 둔다
          const first = last === '';
          last = key; lines = next; build();
          if (!first && !always) appear();   // 폰에서 바꿨으면 지금 한 번 보여 준다(첫 읽기는 시간표대로)
        });
      } catch (_) { /* CDN 이 안 닿으면 기본 소식 그대로 */ }
    })();
  }
</script>
</body>
</html>
